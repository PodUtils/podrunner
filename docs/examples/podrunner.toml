# An example configuration of podrunner (docs/configuration.md): a fake
# source and a fake unit, for a first run on a new host with no forge. The
# gate runs `podrunner check --config` on this file. As it stands, the
# source has no script, so `serve` gets no job. To get one job, remove the
# `#` of the key `script` (the path counts from the directory where
# `serve` runs; the file is docs/examples/fake-jobs.jsonl, the format is in
# docs/fakes.md). A test checks the file with that key on.
host = "host-a"
allow_fake = true

[[source]]
name = "local"
kind = "fake"
tier = "local"
arch = "x86_64"
operator_controlled = true
slots = 1
# script = "docs/examples/fake-jobs.jsonl"

[unit.fake]
slots = 1
command = ["sh", "-c", "echo the unit runs; sleep 1"]

# [cache]                    # a cache of the host for each repository and tier (T-480)
# env = { npm_config_cache = "npm" }

[trust]
organizations = [{ login = "example-org" }]

[pin]
max_age_s = 2592000
[[pin.payload]]
arch = "x86_64"
reference = "runner@sha256:1111111111111111111111111111111111111111111111111111111111111111"
built_at_s = 1763337600
