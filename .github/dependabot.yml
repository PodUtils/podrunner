# Dependabot: each week, the crates of Cargo.lock, the actions of the
# workflows and the pinned images. Each update is applied as an own commit
# on main (no pull request is merged; docs/maintenance.md, "Dependabot").
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The crates of podcrates come by a git tag that a session takes by
    # hand at each release (docs/decisions.md, Delivery). Dependabot sorts
    # the tags of a git source as text and proposes older tags.
    ignore:
      - dependency-name: "pod-*"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /images/trufflehog
    schedule:
      interval: weekly
