name: secrets

# Credentials in the history of this public repository: TruffleHog over each
# commit, in its git mode. On each push, each pull request and each week. CI
# logs are public, so scripts/secrets-report.py prints the findings with no
# secret in them. .github/secrets-allow.txt lists the findings that are not
# credentials.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Each commit, not only the last one.
          fetch-depth: 0
          persist-credentials: false

      # images/trufflehog/Dockerfile is the one place that names the
      # scanner, pinned to a digest.
      - name: The scanner
        run: |
          set -eu
          ref=$(tr -d '\r' < images/trufflehog/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) ;;
            *) echo "images/trufflehog/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac
          scanner=$(sh scripts/pull-image.sh "$ref")
          echo "SCANNER=$scanner" >> "$GITHUB_ENV"

      # The scan must be able to fail: a throwaway key, made here and
      # committed in a repository of its own, must be found.
      - name: A planted key is found
        run: |
          set -u
          plant="$RUNNER_TEMP/plant"
          mkdir -p "$plant"
          git -C "$plant" init -q
          git -C "$plant" -c user.name=plant -c user.email=plant@example.invalid commit -q --allow-empty -m start
          ssh-keygen -q -t ed25519 -N '' -C plant -f "$plant/key"
          git -C "$plant" add key
          git -C "$plant" -c user.name=plant -c user.email=plant@example.invalid commit -q -m plant
          rc=0
          docker run --rm -v "$plant:/repo:ro" "$SCANNER" git file:///repo --json --no-update \
            --no-verification --results=unverified --fail > "$RUNNER_TEMP/plant.jsonl" 2> "$RUNNER_TEMP/plant.err" || rc=$?
          rm -rf "$plant"
          if [ "$rc" -ne 183 ]; then
            echo "the scanner exited $rc on a planted key, not 183 (results found):"
            tail -20 "$RUNNER_TEMP/plant.err"
            exit 1
          fi
          python3 scripts/secrets-report.py --expect PrivateKey "$RUNNER_TEMP/plant.jsonl"

      - name: TruffleHog over the history
        run: |
          set -u
          rc=0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$SCANNER" git file:///repo --json --no-update \
            --results=verified,unknown,unverified > "$RUNNER_TEMP/found.jsonl" 2> "$RUNNER_TEMP/scan.err" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "the scan did not run (exit $rc):"
            tail -20 "$RUNNER_TEMP/scan.err"
            exit 1
          fi
          python3 scripts/secrets-report.py --allow .github/secrets-allow.txt "$RUNNER_TEMP/found.jsonl"
