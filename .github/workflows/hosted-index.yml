# SPDX-License-Identifier: 0BSD
# The multi-arch index of the hosted snapshot (T-555): one tag for each OS,
# OS-latest, that names the published manifest of amd64 and of arm64
# (hosted-snapshot.yml with `publish`). Each manifest is read back from
# ghcr.io and its digest checked; the index is pushed and attested.
name: hosted-index

on:
  workflow_dispatch:
    inputs:
      os:
        description: "The OS of the index"
        required: true
        type: choice
        options: [ubuntu24, ubuntu26]
      amd64:
        description: "The digest of the amd64 manifest (sha256:...)"
        required: true
      arm64:
        description: "The digest of the arm64 manifest (sha256:...)"
        required: true

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push the index
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ inputs.os }}
          AMD64: ${{ inputs.amd64 }}
          ARM64: ${{ inputs.arm64 }}
        run: |
          set -eu
          name=podutils/podrunner-hosted
          for d in "$AMD64" "$ARM64"; do
            case $d in sha256:[0-9a-f]*) [ ${#d} -eq 71 ] || { echo "not a digest: $d" >&2; exit 1; } ;; *) echo "not a digest: $d" >&2; exit 1 ;; esac
          done
          # Each token goes to curl on stdin (-K -), never in argv.
          REGISTRY_TOKEN=$(printf 'user = "x-access-token:%s"\n' "$GH_TOKEN" |
            curl -fsS -K - "https://ghcr.io/token?service=ghcr.io&scope=repository:$name:pull,push" |
            python3 -I -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$REGISTRY_TOKEN"
          export REGISTRY_TOKEN
          out=$RUNNER_TEMP/index
          mkdir -p "$out"
          for pair in "amd64 $AMD64" "arm64 $ARM64"; do
            # shellcheck disable=SC2086 # split the pair into two words
            set -- $pair
            printf 'header = "Authorization: Bearer %s"\n' "$REGISTRY_TOKEN" |
              curl -fsS -K - -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                -o "$out/$1.json" "https://ghcr.io/v2/$name/manifests/$2"
            got="sha256:$(sha256sum "$out/$1.json" | cut -d' ' -f1)"
            [ "$got" = "$2" ] || { echo "the manifest of $1: $got, not $2" >&2; exit 1; }
            python3 -I scripts/hosted/oci.py entry --manifest "$out/$1.json" --arch "$1" > "$out/$1.entry.json"
          done
          python3 -I scripts/hosted/oci.py index --out "$out" "$out/amd64.entry.json" "$out/arm64.entry.json" > /dev/null
          digest=$(python3 -I scripts/hosted/push-blob.py --manifest https://ghcr.io "$name" "$OS-latest" \
            "$out/index.json" application/vnd.oci.image.index.v1+json)
          [ "$digest" = "$(cat "$out/index.json.digest")" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### ghcr.io/$name:$OS-latest"
            echo "\`ghcr.io/$name@$digest\`: amd64 \`$AMD64\`, arm64 \`$ARM64\`"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/podutils/podrunner-hosted
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # No storage record: it needs artifact-metadata: write (COORD-142).
          create-storage-record: false
