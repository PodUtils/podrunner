name: issue-sync

# The issues of podrunner against its record (T-264, the ruling "Issues"
# of the owner): the workflow of podcrates writes the status block of each
# issue from the record, closes an issue that the record closes, and fails
# on drift that it cannot fix. The dry runs 44096256027 and 44099014996
# were read; the sync writes (the owner, 2026-11-17).

on:
  push:
    branches: [main]
    paths:
      - TODO/**
  schedule:
    # Each day at 06:23 UTC, off the hour.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print each change and change nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  issues:
    permissions:
      contents: read
      issues: write
    uses: PodUtils/podcrates/.github/workflows/issue-sync.yml@22d1a7557c982b8eb5bef5b8c0e030f5ac54f6ef # v0.86.0
    with:
      podcrates_ref: v0.86.0
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
