name: release

# A beta release of podrunner (GitHub #15; docs/decisions.md, Releases:
# betas only, no crates.io). With no input, a dry run that checks each
# condition and builds each binary, and tags nothing. With a version
# X.Y.Z-beta.N: the tag vX.Y.Z-beta.N of the commit, a GitHub pre-release
# with the static binaries of x86_64 and aarch64 musl, the SHA-256 of
# each, and a build provenance attestation of each.
#
# T-202: the release also attaches the assets of the local mode: the
# runner image archives (runner-ARCH.tar, runner-full-ARCH.tar) of the
# green runner-image.yml run of the same commit, the installer with the
# pins of the release (podrunner-install.sh, scripts/install-pins.py) and
# one offline bundle for each architecture (podrunner-bundle-ARCH.tar.gz,
# scripts/make-bundle.sh). The images are the ones that the suites of
# runner-image.yml passed on; a build here would give an image that no
# suite ran. A release needs that run: dispatch runner-image.yml on the
# commit first.
#
# T-243: a version needs a green user-gate.yml run of the same commit: the
# user-path gate installs and uses the files that this workflow makes, with
# the same script (scripts/release-assets.sh). The input no_user_gate
# skips that condition only with a reason, and the notes of the release
# must then contain the text "user-path gate: not run".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version X.Y.Z-beta.N (empty: a dry run)"
        required: false
        default: ""
      no_user_gate:
        description: "Release with no green user-gate.yml run: the reason (the notes must say 'user-path gate: not run')"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The runs of gate.yml, runner-image.yml and user-gate.yml.
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.conditions.outputs.images }}
      version: ${{ steps.conditions.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
      NO_USER_GATE: ${{ inputs.no_user_gate }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The conditions of a release
        id: conditions
        run: |
          set -eu
          have=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -n "$VERSION" ]; then
            case "$VERSION" in
              *-beta.[0-9]*) ;;
              *) echo "$VERSION is not X.Y.Z-beta.N: podrunner releases betas only"; exit 1 ;;
            esac
            [ "${VERSION%%-*}" = "$have" ] || { echo "Cargo.toml says $have, not ${VERSION%%-*}"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              echo "the tag v$VERSION exists: a tag never moves"; exit 1
            fi
            # The notes before the tag: a tag never moves, so a release that
            # stops after the tag cannot try again.
            notes="docs/releases/v$VERSION.md"
            [ -f "$notes" ] || { echo "no $notes: write the notes of the release first"; exit 1; }
            sh scripts/check-notes.sh "$notes"
            if [ -n "$NO_USER_GATE" ]; then
              grep -q "user-path gate: not run" "$notes" ||
                { echo "no_user_gate is set: $notes must say 'user-path gate: not run' and why"; exit 1; }
            fi
          fi
          sha=$(git rev-parse HEAD)
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?head_sha=$sha" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')
          echo "the gate at $sha: $state"
          if [ "$state" != success ]; then
            echo "the gate is not green at $sha"
            [ -z "$VERSION" ] || exit 1
          fi
          # T-243: the user-path gate on this commit.
          gate=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow user-gate.yml --commit "$sha" --status success \
            --limit 1 --json databaseId,displayTitle --jq '.[0] // empty | "\(.databaseId) \(.displayTitle)"')
          if [ -n "$gate" ]; then
            echo "the user-path gate at $sha: green, run $gate"
          elif [ -n "$NO_USER_GATE" ]; then
            echo "::warning::no green user-gate.yml run at $sha; released with no_user_gate: $NO_USER_GATE"
          else
            echo "no green user-gate.yml run at $sha: dispatch it on this commit first (docs/maintenance.md, A release)"
            [ -z "$VERSION" ] || exit 1
          fi
          # The version of each file: a dry run names the version of
          # Cargo.toml with -dry.
          echo "version=${VERSION:-$have-dry}" >> "$GITHUB_OUTPUT"
          # T-202: the runner images come from the green runner-image.yml run
          # of this commit.
          images=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/runner-image.yml/runs?head_sha=$sha&status=success" \
            --jq '.workflow_runs[0].id // empty')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          if [ -z "$images" ]; then
            echo "no green runner-image.yml run at $sha: dispatch it on this commit first"
            [ -z "$VERSION" ] || exit 1
          else
            echo "the runner images: runner-image.yml run $images"
          fi

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zig and cargo-zigbuild
        run: sh scripts/release-assets.sh tools
      # scripts/release-assets.sh: the static podrunner and the scale-set
      # sidecar (T-029), each with its .sha256; user-gate.yml makes them in
      # the same way.
      - name: Build, check that it is static, and name it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: sh scripts/release-assets.sh binaries ${{ matrix.target }} "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podrunner-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # T-202: the image archives of the runner-image.yml run, the installer
  # with the pins of the release, and the offline bundles.
  assets:
    needs: [check, build]
    if: needs.check.outputs.images != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      IMAGES: ${{ needs.check.outputs.images }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podrunner-*-linux-musl
          path: dist
          merge-multiple: true
      - name: The image archives of the runner-image.yml run
        run: sh scripts/release-assets.sh images "$IMAGES" dist
      - name: The installer, its pins and the bundles
        run: |
          set -eu -o pipefail
          sh scripts/release-assets.sh local-mode "$VERSION" dist out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-mode
          path: out/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, assets]
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: The binaries are static and match their sums
        run: |
          set -eu
          cd dist
          sha256sum -c ./*.sha256
          for f in podrunner-*-linux-musl scaleset-sidecar-*-linux-musl; do sh ../scripts/check-static.sh "$f"; done
          # T-202: the installer carries the pins of these files.
          grep -qx "PODRUNNER_VERSION=\"$VERSION\"" podrunner-install.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/podrunner-*-linux-musl
            dist/scaleset-sidecar-*-linux-musl
            dist/podrunner-install.sh
            dist/podrunner-manifest.json
            dist/podrunner-bundle-*.tar.gz
            dist/runner-*.tar
      - name: Tag and publish a pre-release
        run: |
          set -eu
          notes="docs/releases/v$VERSION.md"
          [ -f "$notes" ] || { echo "no $notes: write the notes of the release first"; exit 1; }
          git -c user.name=Azathothas -c user.email=ajamx101@gmail.com tag -a "v$VERSION" -m "podrunner v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --prerelease --title "podrunner v$VERSION" \
            --notes-file "$notes" dist/*
