name: release

# A beta release of podrunner (GitHub #15; docs/decisions.md, Releases:
# betas only, no crates.io). With no input, a dry run that checks each
# condition and builds each binary, and tags nothing. With a version
# X.Y.Z-beta.N: the tag vX.Y.Z-beta.N of the commit, a GitHub pre-release
# with the static binaries of x86_64 and aarch64 musl, the SHA-256 of
# each, and a build provenance attestation of each.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version X.Y.Z-beta.N (empty: a dry run)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The conditions of a release
        run: |
          set -eu
          have=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -n "$VERSION" ]; then
            case "$VERSION" in
              *-beta.[0-9]*) ;;
              *) echo "$VERSION is not X.Y.Z-beta.N: podrunner releases betas only"; exit 1 ;;
            esac
            [ "${VERSION%%-*}" = "$have" ] || { echo "Cargo.toml says $have, not ${VERSION%%-*}"; exit 1; }
            if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              echo "the tag v$VERSION exists: a tag never moves"; exit 1
            fi
          fi
          sha=$(git rev-parse HEAD)
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?head_sha=$sha" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')
          echo "the gate at $sha: $state"
          if [ "$state" != success ]; then
            echo "the gate is not green at $sha"
            [ -z "$VERSION" ] || exit 1
          fi

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: zig and cargo-zigbuild
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/zig"
          sh scripts/fetch-zig.sh "$ZIG_VERSION" "$ZIG_SHA256" "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          sh scripts/retry.sh cargo install --locked --quiet cargo-zigbuild --version "$ZIGBUILD_VERSION"
      - name: Build, check that it is static, and name it
        run: |
          set -eu
          PODRUNNER_COMMIT=$(git rev-parse --short=12 HEAD) cargo zigbuild --locked --release --target ${{ matrix.target }} -p podrunner
          mkdir -p dist
          name="podrunner-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/podrunner" "dist/$name"
          sh scripts/check-static.sh "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podrunner-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: The binaries are static and match their sums
        run: |
          set -eu
          cd dist
          sha256sum -c ./*.sha256
          for f in podrunner-*-linux-musl; do sh ../scripts/check-static.sh "$f"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/podrunner-*-linux-musl
      - name: Tag and publish a pre-release
        run: |
          set -eu
          git -c user.name=Azathothas -c user.email=ajamx101@gmail.com tag -a "v$VERSION" -m "podrunner v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --prerelease --title "podrunner v$VERSION" \
            --notes "A beta of podrunner. Not usable for jobs yet: see GitHub #1." dist/*
