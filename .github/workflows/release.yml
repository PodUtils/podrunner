name: release

# A beta release of podrunner (GitHub #15; docs/decisions.md, Releases:
# betas only, no crates.io). With no input, a dry run that checks each
# condition and builds each binary, and tags nothing. With a version
# X.Y.Z-beta.N: the tag vX.Y.Z-beta.N of the commit, a GitHub pre-release
# with the static binaries of x86_64 and aarch64 musl, the SHA-256 of
# each, and a build provenance attestation of each.
#
# T-202: the release also attaches the assets of the local mode: the
# runner image archives (runner-ARCH.tar, runner-full-ARCH.tar) of the
# green runner-image.yml run of the same commit, the installer with the
# pins of the release (podrunner-install.sh, scripts/install-pins.py) and
# one offline bundle for each architecture (podrunner-bundle-ARCH.tar.gz,
# scripts/make-bundle.sh). The images are the ones that the suites of
# runner-image.yml passed on; a build here would give an image that no
# suite ran. A release needs that run: dispatch runner-image.yml on the
# commit first.
#
# T-562: the signer of SHA256SUMS and of release-index.json is this
# workflow at the tag, as pod-release verify --tag checks it (the form of
# podcrates). A run with a version makes the tag and starts this workflow
# on the tag (a tag that GITHUB_TOKEN pushes starts no workflow); the run
# on the tag takes no input, builds the files again, writes the index,
# signs, verifies with pod-release and publishes. A dry run writes the
# index and checks it with pod-release, with no signature.
#
# T-553 (the owner's ruling "ghcr.io"; the form of COORD-142 of
# podcrates): the job image makes ghcr.io/podutils/podrunner:TAG, one
# FROM scratch image of each built binary under one index, and the runner
# images of the release (the archives of the runner-image.yml run, as
# they are) at ghcr.io/podutils/podrunner-runner:TAG and TAG-full. Each
# run builds them and runs the x86_64 image in podvm; only the run on the
# tag pushes, reads each index back, compares each pulled binary with its
# asset, and attests each index in the registry. The job release puts the
# digests into the notes.
#
# T-243: a version needs a green user-gate.yml run of the same commit: the
# user-path gate installs and uses the files that this workflow makes, with
# the same script (scripts/release-assets.sh). The input no_user_gate
# skips that condition only with a reason, and the notes of the release
# must then contain the text "user-path gate: not run".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version X.Y.Z-beta.N (empty: a dry run)"
        required: false
        default: ""
      no_user_gate:
        description: "Release with no green user-gate.yml run: the reason (the notes must say 'user-path gate: not run')"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The runs of gate.yml, runner-image.yml and user-gate.yml.
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.conditions.outputs.images }}
      version: ${{ steps.conditions.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
      NO_USER_GATE: ${{ inputs.no_user_gate }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The conditions of a release
        id: conditions
        run: |
          set -eu
          have=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          # The run on the tag (T-562): the version is the tag's, and the tag
          # exists; each other condition holds as for the run that made it.
          on_tag=""
          case $GITHUB_REF in
            refs/tags/v*)
              [ -z "$VERSION" ] || { echo "the run on a tag takes no version: it is the tag's"; exit 1; }
              VERSION=${GITHUB_REF_NAME#v}
              on_tag=1 ;;
          esac
          if [ -n "$VERSION" ]; then
            case "$VERSION" in
              *-beta.[0-9]*) ;;
              *) echo "$VERSION is not X.Y.Z-beta.N: podrunner releases betas only"; exit 1 ;;
            esac
            [ "${VERSION%%-*}" = "$have" ] || { echo "Cargo.toml says $have, not ${VERSION%%-*}"; exit 1; }
            if [ -z "$on_tag" ] && git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              echo "the tag v$VERSION exists: a tag never moves"; exit 1
            fi
            # The notes before the tag: a tag never moves, so a release that
            # stops after the tag cannot try again.
            notes="docs/releases/v$VERSION.md"
            [ -f "$notes" ] || { echo "no $notes: write the notes of the release first"; exit 1; }
            sh scripts/check-notes.sh "$notes"
            if [ -n "$NO_USER_GATE" ]; then
              grep -q "user-path gate: not run" "$notes" ||
                { echo "no_user_gate is set: $notes must say 'user-path gate: not run' and why"; exit 1; }
            fi
          fi
          sha=$(git rev-parse HEAD)
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?head_sha=$sha" \
            --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')
          echo "the gate at $sha: $state"
          if [ "$state" != success ]; then
            echo "the gate is not green at $sha"
            [ -z "$VERSION" ] || exit 1
          fi
          # T-243: the user-path gate on this commit.
          gate=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow user-gate.yml --commit "$sha" --status success \
            --limit 1 --json databaseId,displayTitle --jq '.[0] // empty | "\(.databaseId) \(.displayTitle)"')
          if [ -n "$gate" ]; then
            echo "the user-path gate at $sha: green, run $gate"
          elif [ -n "$NO_USER_GATE" ]; then
            echo "::warning::no green user-gate.yml run at $sha; released with no_user_gate: $NO_USER_GATE"
          else
            echo "no green user-gate.yml run at $sha: dispatch it on this commit first (docs/maintenance.md, A release)"
            [ -z "$VERSION" ] || exit 1
          fi
          # The version of each file: a dry run names the version of
          # Cargo.toml with -dry.
          echo "version=${VERSION:-$have-dry}" >> "$GITHUB_OUTPUT"
          # T-202: the runner images come from the green runner-image.yml run
          # of this commit.
          images=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/runner-image.yml/runs?head_sha=$sha&status=success" \
            --jq '.workflow_runs[0].id // empty')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          if [ -z "$images" ]; then
            echo "no green runner-image.yml run at $sha: dispatch it on this commit first"
            [ -z "$VERSION" ] || exit 1
          else
            echo "the runner images: runner-image.yml run $images"
          fi

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zig and cargo-zigbuild
        run: sh scripts/release-assets.sh tools
      # scripts/release-assets.sh: the static podrunner and the scale-set
      # sidecar (T-029), each with its .sha256; user-gate.yml makes them in
      # the same way.
      - name: Build, check that it is static, and name it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: sh scripts/release-assets.sh binaries ${{ matrix.target }} "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podrunner-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # T-202: the image archives of the runner-image.yml run, the installer
  # with the pins of the release, and the offline bundles.
  assets:
    needs: [check, build]
    if: needs.check.outputs.images != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      IMAGES: ${{ needs.check.outputs.images }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podrunner-*-linux-musl
          path: dist
          merge-multiple: true
      - name: The image archives of the runner-image.yml run
        run: sh scripts/release-assets.sh images "$IMAGES" dist
      - name: The installer, its pins and the bundles
        run: |
          set -eu -o pipefail
          sh scripts/release-assets.sh local-mode "$VERSION" dist out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-mode
          path: out/
          if-no-files-found: error
          retention-days: 7

  # T-553: the images on ghcr.io (scripts/ghcr.py writes each as an OCI
  # layout and pushes it with scripts/hosted/push-blob.py). A dry run, and
  # a run with a version before its tag, build and check them and push
  # nothing: a broken image fails before the tag. The run on the tag pushes
  # before the job release, so that no release goes out with no images.
  image:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The image archives of the runner-image.yml run.
      actions: read
      # The push, on the tag only.
      packages: write
      # actions/attest-build-provenance with push-to-registry, on the tag.
      id-token: write
      attestations: write
    outputs:
      podrunner: ${{ steps.push.outputs.podrunner }}
      runner: ${{ steps.push.outputs.runner }}
      runner_full: ${{ steps.push.outputs.runner_full }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      IMAGES: ${{ needs.check.outputs.images }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podrunner-*-linux-musl
          path: dist
          merge-multiple: true
      - name: The images, as OCI layouts
        run: |
          set -eu -o pipefail
          tag="v$VERSION"
          case $GITHUB_REF in
            refs/tags/v*) [ "$GITHUB_REF_NAME" = "$tag" ] || { echo "the tag $GITHUB_REF_NAME is not $tag"; exit 1; } ;;
          esac
          (cd dist && sha256sum -c ./podrunner-*.sha256)
          oci=$RUNNER_TEMP/oci
          x=x86_64=dist/podrunner-x86_64-unknown-linux-musl
          y=aarch64=dist/podrunner-aarch64-unknown-linux-musl
          python3 -I scripts/ghcr.py binary --name podrunner --tag "$tag" --revision "$GITHUB_SHA" --out "$oci/podrunner" "$x" "$y"
          python3 -I scripts/ghcr.py check-binary --name podrunner "$oci/podrunner" "$x" "$y"
          if [ -n "$IMAGES" ]; then
            sh scripts/release-assets.sh images "$IMAGES" images
            python3 -I scripts/ghcr.py archives --tag "$tag" --revision "$GITHUB_SHA" --out "$oci/runner" \
              x86_64=images/runner-x86_64.tar aarch64=images/runner-aarch64.tar
            set --
            for a in x86_64 aarch64; do
              [ ! -f "images/runner-full-$a.tar" ] || set -- "$@" "$a=images/runner-full-$a.tar"
            done
            [ $# -eq 0 ] || python3 -I scripts/ghcr.py archives --tag "$tag-full" --revision "$GITHUB_SHA" \
              --out "$oci/runner-full" "$@"
          else
            echo "no green runner-image.yml run: the runner images are not built (a dry run only)"
          fi
          {
            echo "### The images of $tag"
            echo
            echo "| Image | Tag | Index digest |"
            echo "| --- | --- | --- |"
            for name in podrunner runner runner-full; do
              [ -d "$oci/$name" ] || continue
              # The tag and the digest of the index of the layout.
              python3 -I - "$oci/$name/index.json" "$name" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))["manifests"][0]
          print(f"| {sys.argv[2]} | `{d['annotations']['org.opencontainers.image.ref.name']}` | `{d['digest']}` |")
          PY
            done
            echo
            case $GITHUB_REF in refs/tags/v*) echo "The run on the tag pushes them." ;; *) echo "Not the run on a tag: nothing is pushed." ;; esac
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The entrypoint and the format: podvm of images/podvm.toml loads the
      # x86_64 image and runs it, before any push.
      - name: The x86_64 image runs in podvm
        run: |
          set -eu
          eval "$(python3 -I - <<'PY'
          import tomllib
          pin = tomllib.load(open("images/podvm.toml", "rb"))
          print(f"podvm_version={pin['version']} podvm_sha256={pin['sha256']['x86_64']}")
          PY
          )"
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/podvm" \
            "https://github.com/PodUtils/podvm/releases/download/v$podvm_version/podvm-x86_64"
          echo "$podvm_sha256  $RUNNER_TEMP/podvm" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/podvm"
          test "$(id -u)" -ne 0
          python3 -I scripts/ghcr.py podvm-archive --arch x86_64 --ref "podrunner:$VERSION" "$RUNNER_TEMP/oci/podrunner" \
            "$RUNNER_TEMP/podrunner-x86_64.tar"
          export PODVM_STORE="$RUNNER_TEMP/store"
          "$RUNNER_TEMP/podvm" load -i "$RUNNER_TEMP/podrunner-x86_64.tar"
          out=$("$RUNNER_TEMP/podvm" run --rm "podrunner:$VERSION" --version)
          echo "$out"
          case $out in "podrunner $VERSION ("*) ;; *) echo "the image does not run podrunner $VERSION"; exit 1 ;; esac
      # Each index read back from ghcr.io (the manifest of each platform
      # from the index that the registry gives), and each binary pulled by
      # docker and compared with its asset. The login stays for
      # actions/attest.
      - name: Push to ghcr.io, and read back
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu -o pipefail
          oci=$RUNNER_TEMP/oci
          # A token of ghcr.io for one package: masked, in the environment
          # of one command only. GH_TOKEN goes to curl on stdin.
          token() {
            printf 'user = "x-access-token:%s"\n' "$GH_TOKEN" |
              curl -fsS -K - "https://ghcr.io/token?service=ghcr.io&scope=repository:$1:pull,push" |
              python3 -I -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          }
          rows=$RUNNER_TEMP/ghcr-images.md
          {
            echo
            echo "## The images, by digest"
            echo
            echo "Each \`podrunner\` image is \`FROM scratch\`, with the asset at \`/usr/local/bin/podrunner\` as its entrypoint."
            echo "The runner images are the image archives of this release, as \`podvm load -i\` takes them."
            echo "Pull by digest: \`docker pull IMAGE@DIGEST\` or \`podvm pull IMAGE@DIGEST\`."
            echo "Check the provenance of an index: \`gh attestation verify oci://IMAGE@DIGEST --repo $GITHUB_REPOSITORY\`."
            echo
            echo "| Image | Platform | Digest | Asset | SHA-256 of the asset |"
            echo "| --- | --- | --- | --- | --- |"
          } > "$rows"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in podrunner runner runner-full; do
            [ -d "$oci/$name" ] || continue
            case $name in
              podrunner) repo=podutils/podrunner ;;
              *) repo=podutils/podrunner-runner ;;
            esac
            t=$(token "$repo")
            echo "::add-mask::$t"
            digest=$(REGISTRY_TOKEN=$t python3 -I scripts/ghcr.py push --registry https://ghcr.io --repo "$repo" "$oci/$name")
            REGISTRY_TOKEN=$t python3 -I scripts/ghcr.py verify --registry https://ghcr.io --repo "$repo" "$oci/$name" \
              > "$RUNNER_TEMP/$name.rows"
            ref=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["manifests"][0]["annotations"]["org.opencontainers.image.ref.name"])' \
              "$oci/$name/index.json")
            # The rows on descriptor 3: a command of the loop that reads
            # stdin does not take them.
            while read -r platform d <&3; do
              if [ "$platform" = each ]; then
                [ "$d" = "$digest" ] || { echo "ghcr.io/$repo:$ref is $d, not $digest"; exit 1; }
                echo "| \`ghcr.io/$repo:$ref\` | each | \`$d\` | | |" >> "$rows"
                continue
              fi
              case $platform in
                linux/amd64) arch=x86_64 ;;
                linux/arm64) arch=aarch64 ;;
                *) echo "ghcr.io/$repo:$ref: no platform $platform in a release"; exit 1 ;;
              esac
              case $name in
                podrunner)
                  asset=podrunner-$arch-unknown-linux-musl
                  want=$(sha256sum < "dist/$asset" | cut -d' ' -f1)
                  docker pull -q --platform "$platform" "ghcr.io/$repo@$d" > /dev/null
                  c=$(docker create --platform "$platform" "ghcr.io/$repo@$d")
                  docker cp "$c:/usr/local/bin/podrunner" "$RUNNER_TEMP/pulled"
                  docker rm "$c" > /dev/null
                  got=$(sha256sum < "$RUNNER_TEMP/pulled" | cut -d' ' -f1)
                  [ "$got" = "$want" ] || { echo "ghcr.io/$repo@$d: the binary is not $asset ($got, not $want)"; exit 1; }
                  echo "ghcr.io/$repo@$d ($platform): $asset, sha256 $got" ;;
                *)
                  asset=$name-$arch.tar
                  want=$(sha256sum < "images/$asset" | cut -d' ' -f1) ;;
              esac
              echo "| | $platform | \`$d\` | \`$asset\` | \`$want\` |" >> "$rows"
            done 3< "$RUNNER_TEMP/$name.rows"
            echo "$(echo "$name" | tr - _)=$digest" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/$repo:$ref: $digest"
          done
          cat "$rows" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ghcr.io/podutils/podrunner
          subject-digest: ${{ steps.push.outputs.podrunner }}
          push-to-registry: true
          # A storage record is not part of the form, and needs
          # artifact-metadata: write.
          create-storage-record: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && steps.push.outputs.runner != ''
        with:
          subject-name: ghcr.io/podutils/podrunner-runner
          subject-digest: ${{ steps.push.outputs.runner }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && steps.push.outputs.runner_full != ''
        with:
          subject-name: ghcr.io/podutils/podrunner-runner
          subject-digest: ${{ steps.push.outputs.runner_full }}
          push-to-registry: true
          create-storage-record: false
      # A consumer pulls with no login. A new package of ghcr.io can be
      # private: a warning tells an admin of PodUtils to set it public.
      - name: The provenance of each index, and a read with no login
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PODRUNNER: ${{ steps.push.outputs.podrunner }}
          RUNNER: ${{ steps.push.outputs.runner }}
          RUNNER_FULL: ${{ steps.push.outputs.runner_full }}
        run: |
          set -eu
          for pair in "podrunner podutils/podrunner $PODRUNNER" "runner podutils/podrunner-runner $RUNNER" \
            "runner-full podutils/podrunner-runner $RUNNER_FULL"; do
            # shellcheck disable=SC2086 # three words
            set -- $pair
            [ $# -eq 3 ] || continue
            gh attestation verify "oci://ghcr.io/$2@$3" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          docker logout ghcr.io
          for pair in "podrunner podutils/podrunner" "runner podutils/podrunner-runner" "runner-full podutils/podrunner-runner"; do
            # shellcheck disable=SC2086 # two words
            set -- $pair
            [ -d "$RUNNER_TEMP/oci/$1" ] || continue
            t=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:$2:pull" |
              python3 -I -c 'import json,sys; print(json.load(sys.stdin)["token"])') || t=""
            if [ -n "$t" ] && REGISTRY_TOKEN=$t python3 -I scripts/ghcr.py verify --registry https://ghcr.io --repo "$2" \
              "$RUNNER_TEMP/oci/$1" > /dev/null; then
              echo "ghcr.io/$2 ($1): it pulls with no login"
            else
              echo "::warning::ghcr.io/$2 does not pull with no login: an admin of PodUtils sets the package to public"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ghcr-images
          path: ${{ runner.temp }}/ghcr-images.md
          if-no-files-found: error

  # T-562: release-index.json of each file, checked with pod-release with
  # no signature; a changed index must fail. In a dry run, and before the
  # tag of a version: a fault here must not leave a tag with no release.
  dry:
    needs: [check, build, assets]
    if: always() && !startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' && needs.assets.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: The release index and SHA256SUMS, checked by pod-release
        run: |
          set -eu
          sh scripts/release-assets.sh index "$VERSION" dist
          sh scripts/release-assets.sh sums dist
          sh scripts/release-assets.sh check dist

  # A version: the tag of this commit, then this workflow on the tag (a tag
  # that GITHUB_TOKEN pushes starts no workflow; a dispatch does).
  tag:
    needs: [check, build, assets, image, dry]
    if: inputs.version != '' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ inputs.version }}
      NO_USER_GATE: ${{ inputs.no_user_gate }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: The tag, and the run on the tag
        run: |
          set -eu
          git -c user.name=Azathothas -c user.email=ajamx101@gmail.com tag -a "v$VERSION" -m "podrunner v$VERSION"
          git push origin "v$VERSION"
          # The run on the tag checks the same conditions: it gets the
          # reason of a release with no user-path gate too.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION" -f no_user_gate="$NO_USER_GATE"
          echo "the tag v$VERSION; release.yml runs on it, which signs and publishes"

  # The run on the tag (T-562): the signer of SHA256SUMS, and so of
  # release-index.json, is this workflow at the tag.
  release:
    needs: [check, build, assets, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The files of the release only: the rows of the job image go into
      # the notes, not into dist.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podrunner-*-linux-musl
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-mode
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ghcr-images
          path: ${{ runner.temp }}/ghcr
      - name: The binaries are static and match their sums
        run: |
          set -eu
          cd dist
          sha256sum -c ./*.sha256
          for f in podrunner-*-linux-musl scaleset-sidecar-*-linux-musl; do sh ../scripts/check-static.sh "$f"; done
          # T-202: the installer carries the pins of these files.
          grep -qx "PODRUNNER_VERSION=\"$VERSION\"" podrunner-install.sh
      # T-484: SHA256SUMS of each asset with its keyless cosign bundle, as
      # podssh, podnet, podvm and podcrates publish them. T-562: the index
      # is written before SHA256SUMS, so the one signature covers it.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: The index, SHA256SUMS and its signature
        run: |
          set -eu
          sh scripts/release-assets.sh index "$VERSION" dist
          sh scripts/release-assets.sh sums dist
          sh scripts/release-assets.sh check dist
          (cd dist && cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS)
          workflow="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          check() {
            cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json --certificate-identity "$workflow" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$1"
          }
          check dist/SHA256SUMS
          awk 'NR == 1 { $0 = (substr($0, 1, 1) == "0" ? "1" : "0") substr($0, 2) } { print }' dist/SHA256SUMS \
            > "$RUNNER_TEMP/changed"
          if check "$RUNNER_TEMP/changed"; then echo "a changed copy verified"; exit 1; fi
          # The verifier of githome and of the installer (pod-release): the
          # signer at this tag, each file, and the index.
          sh scripts/release-assets.sh verify "$GITHUB_REF_NAME" dist
          echo "SHA256SUMS and release-index.json signed by $workflow; a changed copy fails"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/podrunner-*-linux-musl
            dist/scaleset-sidecar-*-linux-musl
            dist/podrunner-install.sh
            dist/podrunner-manifest.json
            dist/podrunner-bundle-*.tar.gz
            dist/runner-*.tar
            dist/release-index.json
      - name: Publish a pre-release of the tag
        run: |
          set -eu
          notes="docs/releases/v$VERSION.md"
          [ -f "$notes" ] || { echo "no $notes: write the notes of the release first"; exit 1; }
          # T-553: the digests of the images on ghcr.io after the notes.
          cat "$notes" "$RUNNER_TEMP/ghcr/ghcr-images.md" > "$RUNNER_TEMP/notes.md"
          grep -q '^## The images, by digest$' "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "podrunner $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
