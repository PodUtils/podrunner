# SPDX-License-Identifier: 0BSD
# The measure of the disk of a full boot of the hosted snapshot on a
# standard hosted runner (T-557). The job frees the preinstalled trees of
# the runner, puts the podvm store and incusd on / and /mnt (or on one
# volume of both: LVM ext4, or btrfs with a pool of the btrfs driver),
# pulls the snapshot (all layers or the core slice of
# scripts/hosted/slice.py), loads it into the podvm store and imports it
# into incusd (podvm create, as hosted-boot.yml runs it). It boots the
# image only when the file system of incusd and / keep the margin after
# the import. Each step writes the free space (df -B1 of /, /mnt and the
# file system of incusd) and its time (scripts/hosted/space.sh); the
# report runs also after a failed step and goes into the summary and an
# artifact. Report-only: the aim is the numbers. A separate file, not a
# job of hosted-snapshot.yml: the capture must run before any action, and
# its job holds the write permissions of the publish.
name: hosted-measure

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "The digest of an amd64 manifest of ghcr.io/podutils/podrunner-hosted (sha256:...)"
        required: true
        default: ""
      full:
        description: "all: each layer of the snapshot; slice: the core slice of hosted-boot.yml"
        required: true
        default: all
        type: choice
        options: [all, slice]
      place:
        description: "btrfs: the store and incusd on one btrfs over a loop file on / and one on /mnt (one file when /mnt is on /), a pool of the btrfs driver; joined: the store and incusd on one LVM ext4 volume of / and /mnt; store-root: the store on /, incusd on /mnt; store-mnt: the store on /mnt, incusd on /"
        required: true
        default: btrfs
        type: choice
        options: [btrfs, joined, store-root, store-mnt]
      margin:
        description: "The free GiB that the file system of incusd and / must keep after the import for the boot"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the record
        env:
          DIGEST: ${{ inputs.digest }}
          FULL: ${{ inputs.full }}
          PLACE: ${{ inputs.place }}
          MARGIN: ${{ inputs.margin }}
        run: |
          set -eu
          hex=${DIGEST#sha256:}
          case $DIGEST:$hex in sha256:*:*[!0-9a-f]* | sha256:*:) echo "not a digest: $DIGEST" >&2; exit 1 ;; sha256:*) ;; *) echo "not a digest: $DIGEST" >&2; exit 1 ;; esac
          [ ${#hex} -eq 64 ] || { echo "not a digest of 64 hex digits: $DIGEST" >&2; exit 1; }
          # No leading zero: the shell reads 08 as a bad octal number.
          case $MARGIN in '' | *[!0-9]* | 0?*) echo "not a number of GiB: $MARGIN" >&2; exit 1 ;; esac
          M=$RUNNER_TEMP/measure
          mkdir -p "$M"
          echo "M=$M" >> "$GITHUB_ENV"
          # A reserve on /: the report removes it first, so that it can
          # write on a full disk.
          fallocate -l 64M "$M/reserve"
          {
            echo "inputs: digest=$DIGEST full=$FULL place=$PLACE margin=$MARGIN"
            echo "image: ${ImageOS:-} ${ImageVersion:-}"
            echo "cpus: $(nproc)"
            free -b
            lsblk -b -o NAME,SIZE,TYPE,MOUNTPOINTS
            df -B1 / /mnt
            swapon --show --bytes || true
          } > "$M/info.txt" 2>&1
          cat "$M/info.txt"
          sh scripts/hosted/space.sh mark "$M" start 0
      - name: Free the preinstalled trees
        run: |
          set -eu
          # A failed mark must not change the exit code of the step.
          end() { st=$?; sh scripts/hosted/space.sh mark "$M" free "$st" || true; exit "$st"; }
          trap end EXIT
          # The trees of the tools of the runner image: no step of this
          # job uses them. The size of each goes into the record.
          : > "$M/freed.tsv"
          for d in /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup \
            /usr/lib/jvm /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az \
            /opt/pipx /usr/share/miniconda /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/google-cloud-sdk \
            /usr/local/julia*; do
            [ -e "$d" ] || continue
            b=$(sudo du -sb "$d" | cut -f1)
            sudo rm -rf "$d"
            printf '%s\t%s\n' "$d" "$b" >> "$M/freed.tsv"
          done
          docker system prune -af > /dev/null || true
          printf 'docker images\t-\n' >> "$M/freed.tsv"
          # The swap file of /mnt.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          awk -F'\t' '{ printf "%s %.1f GiB\n", $1, $2 / 1073741824 }' "$M/freed.tsv"
      - name: Place the store and incusd
        env:
          PLACE: ${{ inputs.place }}
          MARGIN: ${{ inputs.margin }}
        run: |
          set -eu
          # A failed mark must not change the exit code of the step.
          end() { st=$?; sh scripts/hosted/space.sh mark "$M" place "$st" || true; exit "$st"; }
          trap end EXIT
          me="$(id -u):$(id -g)"
          # The loop files of joined and btrfs: one on / and one on /mnt.
          # / keeps the margin of the boot and 2 GiB for the runner and
          # the record. On some hosted images /mnt is a directory of /
          # (one dm device, cow-root): a second file then takes the same
          # free bytes again, / fills, and the runner is lost (T-613).
          # Then make one file on / only.
          loops() {
            r=$(( $(df -B1 --output=avail / | sed -n 2p) - ((MARGIN + 2) << 30) ))
            sudo fallocate -l "$r" "/var/tmp/$1-root.img"
            devs=$(sudo losetup -f --show "/var/tmp/$1-root.img")
            if [ "$(stat -c %d /)" = "$(stat -c %d /mnt)" ]; then
              echo "loops: /mnt is on the file system of /: one loop file of $r bytes" | tee -a "$M/info.txt"
              return 0
            fi
            m=$(( $(df -B1 --output=avail /mnt | sed -n 2p) - (1 << 30) ))
            sudo fallocate -l "$m" "/mnt/$1-mnt.img"
            devs="$devs $(sudo losetup -f --show "/mnt/$1-mnt.img")"
            echo "loops: $r bytes on / and $m bytes on /mnt" | tee -a "$M/info.txt"
          }
          # The weekly trim of the image trims each mount, also the loop
          # file systems below: stop it for the run.
          sudo systemctl stop fstrim.timer 2> /dev/null || true
          case $PLACE in
          joined)
            # One ext4 volume of LVM over the loop files.
            loops joined
            # shellcheck disable=SC2086 # $devs is a list of devices
            sudo pvcreate -q $devs
            # shellcheck disable=SC2086
            sudo vgcreate -q measure $devs
            sudo lvcreate -q -y -l 100%FREE -n joined measure
            # No discard: it punches holes in the loop files, and the
            # reserve of / is then not real.
            sudo mkfs.ext4 -q -m 0 -E nodiscard /dev/measure/joined
            sudo mkdir -p /srv/joined
            # ext4 has no discard at mount unless an option asks for it.
            sudo mount /dev/measure/joined /srv/joined
            findmnt -no OPTIONS /srv/joined | tee -a "$M/info.txt"
            work=/srv/joined/w incusd=/srv/joined/incus pool=/srv/joined
            ;;
          btrfs)
            # One btrfs over the loop files, data and metadata single: no
            # second copy of a block. A pool of the btrfs driver keeps the
            # image as a subvolume and the root of an instance as its
            # snapshot (shared blocks); a pool of the dir driver copies
            # the tree for each (T-613).
            command -v mkfs.btrfs > /dev/null || {
              sh scripts/retry.sh sudo apt-get -qq update
              sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends btrfs-progs
            }
            loops btrfs
            # -K: no discard, as for joined.
            # shellcheck disable=SC2086
            sudo mkfs.btrfs -q -f -K -L measure -d single -m single $devs
            sudo mkdir -p /srv/btrfs
            # shellcheck disable=SC2086
            set -- $devs
            # nodiscard: btrfs since Linux 6.2 turns on discard=async at
            # mount on a device with discard (a loop device has it).
            sudo mount -o "nodiscard,$(printf 'device=%s,' "$@" | sed 's/,$//')" "$1" /srv/btrfs
            findmnt -no OPTIONS /srv/btrfs | tee -a "$M/info.txt"
            sudo btrfs filesystem show /srv/btrfs | tee -a "$M/info.txt"
            # incusd makes the subvolume of the pool (/srv/btrfs/pool)
            # itself: it refuses a directory that is not a subvolume.
            work=/srv/btrfs/w incusd=/srv/btrfs/incus pool=/srv/btrfs
            ;;
          store-root) work=/var/tmp/measure-w incusd=/mnt/incus pool=/mnt/incus ;;
          store-mnt) work=/mnt/w incusd="" pool=/var/lib/incus ;;
          *) echo "no place $PLACE" >&2; exit 1 ;;
          esac
          sudo mkdir -p "$work"
          sudo chown "$me" "$work"
          # incusd keeps its images and its storage pool in /var/lib/incus:
          # a bind mount before the install puts them on the chosen file
          # system.
          if [ -n "$incusd" ]; then
            sudo mkdir -p "$incusd" /var/lib/incus
            sudo mount --bind "$incusd" /var/lib/incus
          fi
          { echo "W=$work"; echo "PODVM_STORE=$work/store"; echo "POOL=$pool"; } >> "$GITHUB_ENV"
          # incusd makes /var/lib/incus at its install, after this step.
          sudo mkdir -p "$pool"
          df -B1 / /mnt "$pool"
      - name: podvm and incusd
        env:
          PLACE: ${{ inputs.place }}
        run: |
          set -eu
          # A failed mark must not change the exit code of the step.
          end() { st=$?; sh scripts/hosted/space.sh mark "$M" incusd "$st" || true; exit "$st"; }
          trap end EXIT
          eval "$(python3 -I - <<'PY'
          import tomllib
          pin = tomllib.load(open("images/podvm.toml", "rb"))
          print(f"podvm_version={pin['version']} podvm_sha256={pin['sha256']['x86_64']}")
          PY
          )"
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/podvm" \
            "https://github.com/PodUtils/podvm/releases/download/v$podvm_version/podvm-x86_64"
          echo "$podvm_sha256  $RUNNER_TEMP/podvm" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/podvm"
          sh scripts/retry.sh sudo apt-get -qq update
          sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends incus dnsmasq-base
          if [ "$PLACE" = btrfs ]; then
            # The preseed of --minimal, with a pool of the btrfs driver on
            # the btrfs of the place step. podvm puts the instance on the
            # root disk of the default profile, so this pool holds the
            # image and the instance.
            sudo incus admin init --preseed <<YAML
          networks:
          - name: incusbr0
            type: bridge
            config:
              ipv4.address: auto
              ipv6.address: auto
          storage_pools:
          - name: default
            driver: btrfs
            config:
              source: $POOL/pool
          profiles:
          - name: default
            devices:
              root:
                type: disk
                path: /
                pool: default
              eth0:
                type: nic
                name: eth0
                network: incusbr0
          YAML
          else
            sudo incus admin init --minimal
          fi
          sudo usermod -aG incus-admin "$(id -un)"
          sudo incus storage list | tee -a "$M/info.txt"
      - name: Pull the snapshot
        env:
          DIGEST: ${{ inputs.digest }}
          FULL: ${{ inputs.full }}
        run: |
          set -eu
          # A failed mark must not change the exit code of the step.
          end() { st=$?; sh scripts/hosted/space.sh mark "$M" pull "$st" || true; exit "$st"; }
          trap end EXIT
          if [ "$FULL" = all ]; then set -- --all --ref hosted:full; else set -- --ref hosted:core; fi
          dig=$(python3 -I scripts/hosted/slice.py --digest "$DIGEST" "$@" --out "$W/layout")
          echo "IMAGE=hosted@$dig" >> "$GITHUB_ENV"
          du -sb "$W/layout" | tee -a "$M/info.txt"
      - name: Tar the layout
        run: |
          set -eu
          # A failed mark must not change the exit code of the step.
          end() { st=$?; sh scripts/hosted/space.sh mark "$M" tar "$st" || true; exit "$st"; }
          trap end EXIT
          # --remove-files: the layout and the tar are not both on the disk.
          (cd "$W/layout" && find . -type f | sed 's#^\./##' | sort |
            tar -cf "$W/image.tar" --no-recursion --remove-files -T -)
          rm -rf "$W/layout"
          ls -l "$W/image.tar"
      - name: Load into the podvm store
        run: |
          set -eu
          # A failed mark must not change the exit code of the step.
          end() { st=$?; sh scripts/hosted/space.sh mark "$M" load "$st" || true; exit "$st"; }
          trap end EXIT
          "$RUNNER_TEMP/podvm" load -i "$W/image.tar"
          rm -f "$W/image.tar"
      - name: Import into incusd
        # A bound for a hung incusd or podvm, not a measure: the full
        # import of the snapshot unpacks about 57 GB three times.
        timeout-minutes: 180
        run: |
          set -eu
          # The use of the disk every 15 s: the create can fill it, and a
          # failed run must show the peak.
          while sleep 15; do date +%T; df -B1 /srv/btrfs 2> /dev/null || df -B1 /; [ -d /srv/btrfs ] && sudo btrfs filesystem usage -b /srv/btrfs | sed -n 1,25p; done > "$M/import-trace.txt" 2>&1 &
          trace=$!
          stop() {
            st=$?
            # The loop leaves its sleep and its sudo children: take their
            # pids first, then end the loop, then the children.
            kids=$(pgrep -P "$trace" 2> /dev/null || true)
            kill "$trace" 2> /dev/null || true
            # shellcheck disable=SC2086 # $kids is a list of pids
            [ -z "$kids" ] || kill $kids 2> /dev/null || true
            # A failed mark must not change the exit code of the step.
            sh scripts/hosted/space.sh mark "$M" import "$st" || true
            exit "$st"
          }
          trap stop EXIT
          # create imports the image and makes the root of an instance in
          # the pool, with no start.
          rc=0
          sg incus-admin -c "PODVM_STORE=$PODVM_STORE $RUNNER_TEMP/podvm create --name measure --podvm-tier=incus --podvm-init=image --podvm-net none $IMAGE /bin/true" < /dev/null 2> "$M/import-stderr.txt" || rc=$?
          cat "$M/import-stderr.txt" >&2
          echo "import: podvm create exit $rc" | tee -a "$M/info.txt"
          # podvm 0.2.0-beta.39 gives the need of the image and the free
          # space of a pool of the dir driver: a refusal before the import,
          # a warning, or a line after an answer over its bound (COORD-124).
          grep -E '(warning:|incus tier:).*(free|need)' "$M/import-stderr.txt" | sed 's/^/import: /' | tee -a "$M/info.txt" || true
          [ "$rc" -eq 0 ] || exit "$rc"
          timeout 60 sudo incus list --format csv -c nsS | tee -a "$M/info.txt"
      - name: Boot when it fits
        # The sum of the time limits of the commands below is about
        # 38 min; the step ends before the job.
        timeout-minutes: 45
        env:
          MARGIN: ${{ inputs.margin }}
        run: |
          set -eu
          need=$((MARGIN << 30))
          pf=$(df -B1 --output=avail "$POOL" | sed -n 2p)
          rf=$(df -B1 --output=avail / | sed -n 2p)
          if [ "$pf" -lt "$need" ] || [ "$rf" -lt "$need" ]; then
            echo "No boot: free $pf bytes for incusd and $rf on /, the margin is $need" | tee -a "$M/info.txt"
            sh scripts/hosted/space.sh mark "$M" boot-skipped 0
            exit 0
          fi
          # The monitor of incusd runs as root; its command line has the
          # bracket so that pkill does not match its own sudo.
          stop_monitor() { sudo pkill -f '[i]ncus monitor' 2> /dev/null || true; }
          stop() {
            st=$?
            stop_monitor
            sh scripts/hosted/space.sh mark "$M" boot "$st" || true
            exit "$st"
          }
          trap stop EXIT
          podvm=$RUNNER_TEMP/podvm
          # The instance that create made: start it by incus itself, before
          # podvm run removes it. A failed boot of podvm run leaves no
          # console and no log, so this start keeps them. Each command
          # can fail: the file is the record, not a check.
          # The instance of this step only (podvm names it after --name):
          # incusd can hold others.
          name=$(timeout 60 sudo incus list --format csv -c n 2> /dev/null | grep -Fx measure | head -n 1) || true
          name=${name:-measure}
          d=$M/boot-diag.txt
          {
            echo "## instance $name"
            timeout 60 sudo incus start "$name" || true
            # The progress text of incus start has no newline at its end.
            echo
            echo "## systemctl is-system-running, one line for each poll"
            t0=$(date +%s)
            for _ in $(seq 12); do
              state=$(timeout 20 sudo incus exec "$name" -- systemctl is-system-running 2> /dev/null | head -n 1) || true
              echo "$(($(date +%s) - t0)) s: ${state:-(no answer)}"
              case $state in running | degraded) break ;; esac
              sleep 5
            done
            echo "## systemctl --failed"
            timeout 20 sudo incus exec "$name" -- systemctl --failed --no-pager 2>&1 || true
            echo "## journalctl -b -n 200"
            timeout 30 sudo incus exec "$name" -- journalctl -b --no-pager -n 200 2>&1 || true
            echo "## incus console --show-log"
            timeout 60 sudo incus console --show-log "$name" 2>&1 || true
            echo "## incus info --show-log"
            timeout 60 sudo incus info --show-log "$name" 2>&1 || true
            echo "## incus config show --expanded"
            timeout 60 sudo incus config show "$name" --expanded 2>&1 || true
            echo "## incus storage show default"
            timeout 60 sudo incus storage show default 2>&1 || true
            echo "## dmesg | tail -n 80"
            sudo dmesg 2>&1 | tail -n 80 || true
          } > "$d" 2>&1 || true
          timeout 60 sudo incus stop -f "$name" > /dev/null 2>&1 || true
          timeout 120 sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm rm -f --podvm-tier=incus measure" || true
          out=$RUNNER_TEMP/out
          mkdir -p "$out" && chmod 0777 "$out"
          cat > "$out/checks.sh" <<'SH'
          echo "checks: start as $(id -u)" > /out/started
          systemctl is-system-running > /out/state 2>&1
          systemctl --failed --no-legend --plain > /out/failed 2>&1
          df -B1 / > /out/df 2>&1
          SH
          # The events of incusd around the run of podvm.
          # shellcheck disable=SC2024 # the file is the user's, by intent
          sudo incus monitor --pretty > "$M/incus-monitor.txt" 2>&1 &
          mon=$!
          rc=0
          timeout 600 sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm run -d -i --name measure --podvm-tier=incus --podvm-init=image --podvm-net none -v $out:/out $IMAGE /bin/sh /out/checks.sh" < /dev/null || rc=$?
          state=""
          # A deadline, not a count: each inspect can take its 30 s.
          end=$(($(date +%s) + 600))
          while [ "$(date +%s)" -lt "$end" ]; do
            state=$(timeout 30 sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm inspect --podvm-tier=incus --format '{{.Status}} {{.ExitCode}}' measure" 2> /dev/null | head -n 1) || true
            case $state in Running*) sleep 10 ;; *) break ;; esac
          done
          {
            echo "boot: run -d exit $rc, state $state"
            for f in started state failed df; do echo "--- $f"; cat "$out/$f" 2> /dev/null || echo "(absent)"; done
          } | tee -a "$M/info.txt"
          stop_monitor
          kill "$mon" 2> /dev/null || true
          timeout 120 sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm rm -f --podvm-tier=incus measure" || true
          [ "$rc" -eq 0 ] && [ -s "$out/started" ]
      - name: The report
        if: always()
        env:
          PLACE: ${{ inputs.place }}
        run: |
          set -u
          M=${M:-$RUNNER_TEMP/measure}
          mkdir -p "$M"
          rm -f "$M/reserve"
          # The use of the store and of incusd, tree by tree.
          {
            [ -n "${PODVM_STORE:-}" ] && timeout 900 sudo du -sb "$PODVM_STORE"/* 2>&1
            timeout 900 sudo du -sb /var/lib/incus/images /var/lib/incus/storage-pools 2>&1
          } > "$M/du.txt" || true
          # The state of incusd after a failed import: its log, the kernel
          # messages of btrfs and the images that it holds.
          { sudo journalctl -u incus --no-pager -n 200; } > "$M/incus-journal.txt" 2>&1 || true
          sudo dmesg 2>&1 | grep -iE 'btrfs|apparmor|lxc|idmap|overlay|cgroup' | tail -50 > "$M/dmesg-btrfs.txt" || true
          { sudo ls -l /var/lib/incus/images; } > "$M/incus-images.txt" 2>&1 || true
          # The inodes: a file system can be full of files before bytes.
          df -i / /mnt "${POOL:-/}" >> "$M/du.txt" 2>&1 || true
          # du counts a block that two subvolumes share two times: btrfs
          # gives the exclusive and the shared bytes.
          if [ "$PLACE" = btrfs ] && [ -n "${POOL:-}" ]; then
            {
              timeout 900 sudo btrfs filesystem du -s --raw /var/lib/incus/storage-pools/default/images \
                /var/lib/incus/storage-pools/default/containers
              sudo btrfs filesystem usage -b "$POOL"
            } >> "$M/du.txt" 2>&1 || true
          fi
          {
            echo "## The measure of a boot of the hosted snapshot (T-557)"
            echo
            echo '```'
            head -n 3 "$M/info.txt" 2> /dev/null || echo "(no info.txt: the first step failed)"
            echo '```'
            echo
            case $PLACE in
            joined)
              echo "The place is joined: from the step place on, a loop file fills / and /mnt, and the columns of incusd give the volume of the store and of incusd."
              echo
              ;;
            btrfs)
              echo "The place is btrfs: from the step place on, a loop file fills / and /mnt, and the columns of incusd give the btrfs of the store and of incusd (df -B1). pool.txt has btrfs filesystem usage -b at each step."
              echo
              ;;
            esac
            sh scripts/hosted/space.sh report "$M"
            echo
            echo "### Freed trees"
            echo
            awk -F'\t' '$2 != "-" { s += $2; printf "- `%s`: %.1f GiB\n", $1, $2 / 1073741824 } END { printf "\nTotal: %.1f GiB\n", s / 1073741824 }' "$M/freed.tsv" 2> /dev/null
            echo
            echo "### The use of the store and of incusd (du -sb), and the inodes (df -i)"
            echo
            echo '```'
            cat "$M/du.txt" 2> /dev/null
            echo '```'
            for f in import-stderr.txt import-trace.txt incus-images.txt dmesg-btrfs.txt incus-journal.txt; do
              echo
              echo "### $f (the end)"
              echo
              echo '```'
              tail -n 40 "$M/$f" 2> /dev/null || echo "(absent)"
              echo '```'
            done
            for f in boot-diag.txt incus-monitor.txt; do
              echo
              echo "### $f (the end)"
              echo
              echo '```'
              tail -n 60 "$M/$f" 2> /dev/null || echo "(absent)"
              echo '```'
            done
            if [ "$PLACE" = btrfs ]; then
              echo
              echo "### The btrfs at each step (btrfs filesystem usage -b)"
              echo
              echo '```'
              grep -E '^---|Device size|Device allocated|Used:|Free \(estimated\)|Data,|Metadata,' "$M/pool.txt" 2> /dev/null
              echo '```'
            fi
          } > "$M/summary.md"
          cat "$M/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$M/summary.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measure-${{ inputs.full }}-${{ inputs.place }}
