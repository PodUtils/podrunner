# SPDX-License-Identifier: 0BSD
# The boot of the hosted snapshot in hosted CI (T-556): the core slice of
# a published manifest (scripts/hosted/slice.py: the base, the libraries
# of the distribution and boot, with no trees of the tools) goes into a
# podvm store and boots in an incus system container with the init of the
# image (podvm --podvm-init=image). The checks in the instance write their
# results into a mounted directory. The boot step fails when `run -d` does
# not exit 0, or when /out/started, /out/trace or the console marker is
# absent (scripts/hosted/boot-checks.py, T-582); the summary names each
# check that did not hold. The full snapshot needs about 190 GB in incusd
# (T-551, T-557), more than a hosted runner has. A runner image of
# hosted-runner.yml keeps its runner layer in the slice, and the file
# `runner` of the checks reports it (T-541). Then a canned job runs in it
# through the slots of podrunner on the incus kind with `init = "image"`
# (crates/podrunner-broker-fake/tests/hosted.rs): the job must see the
# hosted work folder, the tool cache and the .env of the layer, and
# actions/setup-python must take the Python of the tool cache. The slice
# keeps the tool cache of that one Python for it. A snapshot with no runner
# layer boots, and the canned job is skipped with the reason.
name: hosted-boot

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "The digest of an amd64 manifest of ghcr.io/podutils/podrunner-hosted (sha256:...): a snapshot, or its runner image (hosted-runner.yml)"
        required: true
      python:
        description: "The Python of the tool cache that the slice keeps and that setup-python asks for (3.N)"
        default: "3.12"
      plant:
        description: "A planted defect that must make the run red: none, or work-folder (the kind gives /home/runner/_work)"
        type: choice
        default: none
        options: [none, work-folder]
      rootless_podman:
        description: "Run the offline rootless Podman and FUSE overlay probe as runner (T-674)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The core slice
        env:
          DIGEST: ${{ inputs.digest }}
          PYTHON: ${{ inputs.python }}
        run: |
          set -eu
          case $DIGEST in sha256:[0-9a-f]*) [ ${#DIGEST} -eq 71 ] ;; *) echo "not a digest: $DIGEST" >&2; exit 1 ;; esac
          case $PYTHON in 3.[0-9] | 3.[0-9][0-9]) ;; *) echo "python is 3.N, not: $PYTHON" >&2; exit 1 ;; esac
          df -h / /mnt
          # /mnt belongs to root on a hosted runner: a work directory of the
          # user of the job.
          sudo mkdir -p /mnt/w
          sudo chown "$(id -u):$(id -g)" /mnt/w
          # T-541: the tool cache of one Python and its parent directory, for
          # the setup-python step of the canned job. T-610: a capture names
          # the layer toolcache-Python-3.N.P; a capture before it named the
          # version only (toolcache-3.N.P). Remove the old glob when the
          # pinned snapshot has the new names.
          dig=$(python3 -I scripts/hosted/slice.py --digest "$DIGEST" --ref hosted:core --out /mnt/w/slice \
            --keep opt-hostedtoolcache --keep "toolcache-Python-$PYTHON.*" --keep "toolcache-$PYTHON.*" \
            --layers /mnt/w/layers)
          echo "SLICE=$dig" >> "$GITHUB_ENV"
          echo "the kept layers: $(tr '\n' ' ' < /mnt/w/layers)"
          # ImageOS of the snapshot, from the labels of its config.
          os=$(python3 -I - /mnt/w/slice <<'PY'
          import json, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          blob = lambda digest: json.loads((d / "blobs/sha256" / digest[7:]).read_text())
          m = blob(json.loads((d / "index.json").read_text())["manifests"][0]["digest"])
          print(blob(m["config"]["digest"]).get("config", {}).get("Labels", {}).get("dev.podrunner.hosted.image-os", ""))
          PY
          )
          case $os in *[!a-z0-9-]*) echo "not an ImageOS: $os" >&2; exit 1 ;; esac
          echo "IMAGE_OS=$os" >> "$GITHUB_ENV"
          (cd /mnt/w/slice && find . -type f | sed 's#^\./##' | sort | tar -cf /mnt/w/slice.tar --no-recursion -T -)
          rm -rf /mnt/w/slice
          ls -l /mnt/w/slice.tar
      - name: podvm and incusd
        run: |
          set -eu
          eval "$(python3 -I - <<'PY'
          import tomllib
          pin = tomllib.load(open("images/podvm.toml", "rb"))
          print(f"podvm_version={pin['version']} podvm_sha256={pin['sha256']['x86_64']}")
          PY
          )"
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/podvm" \
            "https://github.com/PodUtils/podvm/releases/download/v$podvm_version/podvm-x86_64"
          echo "$podvm_sha256  $RUNNER_TEMP/podvm" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/podvm"
          sh scripts/retry.sh sh scripts/apt-ubuntu.sh update
          sh scripts/retry.sh sh scripts/apt-ubuntu.sh install incus dnsmasq-base
          sudo incus admin init --minimal
          sudo usermod -aG incus-admin "$(id -un)"
      - name: Prepare the offline Podman probe
        if: ${{ inputs.rootless_podman }}
        run: |
          set -eu
          out=$RUNNER_TEMP/out
          mkdir -p "$out" && chmod 0777 "$out"
          script=$out/476-incus-rootless-podman.sh
          sh scripts/retry.sh curl -qfsSLo "$script" \
            https://raw.githubusercontent.com/PodUtils/podvm/0b87fa92f81340af8b96c4508439b229949ac686/experiments/476-incus-rootless-podman.sh
          printf '%s  %s\n' 6505a840565d0e67f4424ffbbdc1d330064a2e057e0bdca74f24d32dc33f2530 "$script" | sha256sum -c
          sh scripts/retry.sh sh scripts/apt-ubuntu.sh install podman
          image=mirror.gcr.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          sh scripts/retry.sh sudo podman pull --platform linux/amd64 "$image"
          sudo podman tag "$image" localhost/podvm-476:alpine
          sudo podman save --format oci-archive -o "$out/workload.oci.tar" localhost/podvm-476:alpine
          sudo chmod a+r "$script" "$out/workload.oci.tar"
      - name: Boot the slice with the init of the image
        env:
          ROOTLESS_PODMAN: ${{ inputs.rootless_podman }}
        run: |
          set -u
          export PODVM_STORE=/mnt/w/store
          podvm=$RUNNER_TEMP/podvm
          "$podvm" load -i /mnt/w/slice.tar
          rm -f /mnt/w/slice.tar
          out=$RUNNER_TEMP/out
          mkdir -p "$out" && chmod 0777 "$out"
          # The checks run in the instance from the mounted directory: no
          # quoting through sg and podvm.
          # The first run powered the instance off with no file of the
          # checks: a marker and a trace tell whether the checks ran, and
          # the console gets each line too.
          cat > "$out/checks.sh" <<'SH'
          echo "checks: start as $(id -u) in $(pwd)" > /out/started
          cat /out/started > /dev/console 2> /dev/null || true
          exec 2> /out/trace
          set -x
          systemctl is-system-running > /out/state 2>&1
          systemctl --failed --no-legend --plain > /out/failed 2>&1
          cat /proc/1/comm > /out/pid1
          uname -r > /out/kernel
          sed -n 's/^PRETTY_NAME=//p' /etc/os-release > /out/os
          test -s /etc/machine-id && echo filled > /out/machine-id
          getcap /usr/bin/ping > /out/cap 2>&1
          ls /etc/ssh/ssh_host_*_key > /out/ssh-keys 2>&1
          # The runner layer of a runner image (T-541): the owner and the
          # mode of its paths, the lines of its .env, its credential link.
          r=/home/runner/actions-runner
          if [ -d "$r" ]; then
            stat -c '%n %U:%G %a' "$r" "$r/run.sh" "$r/hooks/podrunner-job-started.sh" /home/runner/work > /out/runner 2>&1
            grep -E '^(ImageOS|ImageVersion|RUNNER_TOOL_CACHE|AGENT_TOOLSDIRECTORY|ACTIONS_RUNNER_HOOK_JOB_STARTED)=' "$r/.env" >> /out/runner 2>&1
            readlink "$r/.runner" >> /out/runner 2>&1
          fi
          echo "checks: end" > /dev/console 2> /dev/null || true
          SH
          engine=
          if [ "$ROOTLESS_PODMAN" = true ]; then
            engine=--podvm-engine
            cat >> "$out/checks.sh" <<'SH'
          sh /out/476-incus-rootless-podman.sh /out/workload.oci.tar localhost/podvm-476:alpine > /out/476.log 2>&1
          rc=$?
          printf '%s\n' "$rc" > /out/476.exit
          exit "$rc"
          SH
          fi
          # bash -e: a failed run must reach the logs and the summary.
          rc=0
          sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm run -d -i --name core --podvm-tier=incus --podvm-init=image $engine --podvm-net none -v $out:/out hosted@$SLICE /bin/sh /out/checks.sh" < /dev/null || rc=$?
          state=""
          for _ in $(seq 120); do
            state=$(sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm inspect --podvm-tier=incus --format '{{.Status}} {{.ExitCode}}' core" 2>&1) || true
            case $state in Running*) sleep 10 ;; *) break ;; esac
          done
          echo "--- podvm logs"
          sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm logs --podvm-tier=incus core" 2>&1 | tail -n 40
          # The view of incusd: the LXC log and the console of the init.
          echo "--- incus list"
          sudo incus list --format csv -c nsS || true
          for i in $(sudo incus list --format csv -c n); do
            echo "--- incus info --show-log $i"
            sudo incus info --show-log "$i" 2>&1 | tail -n 60
            echo "--- incus console --show-log $i"
            # shellcheck disable=SC2024 # the log file belongs to the runner user, not to root
            sudo incus console --show-log "$i" > "$RUNNER_TEMP/console.log" 2>&1 || true
            echo "($(wc -l < "$RUNNER_TEMP/console.log") lines; the first 150, the failures and the lines of the checks, the last 40)"
            head -n 150 "$RUNNER_TEMP/console.log"
            echo "--- the failures and the checks"
            grep -n -E 'FAILED|Failed|failed|checks:|podvm|Power|poweroff' "$RUNNER_TEMP/console.log" | head -n 80 || true
            echo "--- the end"
            tail -n 40 "$RUNNER_TEMP/console.log"
          done
          echo "--- the files of the checks on the host"
          ls -la "$out"
          sg incus-admin -c "PODVM_STORE=$PODVM_STORE $podvm rm -f --podvm-tier=incus core" || true
          # The checks that block (T-582): a run with no boot must end red.
          c=0
          python3 -I scripts/hosted/boot-checks.py --rc "$rc" --out "$out" \
            --console "$RUNNER_TEMP/console.log" --state "$state" > "$RUNNER_TEMP/summary.md" || c=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/summary.md"
          if [ "$ROOTLESS_PODMAN" = true ]; then
            if [ -f "$out/476.log" ]; then cat "$out/476.log"; fi
            if printf '%s\n' "$state" | grep -Fxq 'Stopped 0' \
              && grep -Fxq 0 "$out/476.exit" \
              && grep -Fxq 'PASS: runner used rootless Podman offline and read and wrote through fuse-overlayfs' "$out/476.log"; then
              echo 'Rootless Podman and FUSE overlay passed as runner.' | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo '::error title=hosted-boot::the rootless Podman proof needs Stopped 0, exit 0 and the PASS transcript'
              c=1
            fi
          fi
          exit "$c"
      - name: The rootless Podman transcript
        if: ${{ always() && inputs.rootless_podman }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootless-podman
          path: |
            ${{ runner.temp }}/out/476.log
            ${{ runner.temp }}/out/476.exit
      # T-541: the canned job in the runner layer, through the slots of
      # podrunner on the incus kind that boots the init of the image, as
      # docs/hosted-snapshot.md configures it. The fake broker serves the
      # job and the tarball of setup-python through the egress socket of
      # the unit; the instance has no NIC.
      - name: The canned job in the runner layer
        env:
          PYTHON: ${{ inputs.python }}
          PLANT: ${{ inputs.plant }}
          # actions/setup-python v7.1.0.
          SETUP_PYTHON: 6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        run: |
          set -euo pipefail
          if ! grep -qx runner /mnt/w/layers; then
            echo "No canned job: the manifest has no layer \`runner\`. Give the digest of a runner image of hosted-runner.yml (T-541)." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q -e "^toolcache-Python-$PYTHON\." -e "^toolcache-$PYTHON\." /mnt/w/layers; then
            echo "::error title=hosted-boot::the slice has no layer toolcache-Python-$PYTHON.* (or toolcache-$PYTHON.* of an old capture): give a python of the tool cache of the snapshot"
            exit 1
          fi
          case $PLANT in none | work-folder) ;; *) echo "plant is none or work-folder, not: $PLANT" >&2; exit 1 ;; esac
          sh scripts/retry.sh rustup toolchain install
          export CARGO_TARGET_DIR=/mnt/w/target
          cargo test -p podrunner-broker-fake --test hosted --no-run
          actions=$RUNNER_TEMP/actions
          mkdir -p "$actions/actions_setup-python"
          sh scripts/retry.sh curl -qfsSLo "$actions/actions_setup-python/$SETUP_PYTHON.tar.gz" \
            "https://codeload.github.com/actions/setup-python/tar.gz/$SETUP_PYTHON"
          # The summary gets the lines of the job also when the test fails.
          rc=0
          sg incus-admin -c "PODRUNNER_PODVM='$RUNNER_TEMP/podvm' PODRUNNER_PODVM_IMAGES=/mnt/w/store \
            PODRUNNER_HOSTED_IMAGE='hosted@$SLICE' PODRUNNER_HOSTED_PYTHON='$PYTHON' PODRUNNER_HOSTED_IMAGE_OS='$IMAGE_OS' \
            PODRUNNER_HOSTED_ACTIONS='$actions' PODRUNNER_HOSTED_SETUP_PYTHON='$SETUP_PYTHON' PODRUNNER_PLANT='$PLANT' \
            CARGO_TARGET_DIR=/mnt/w/target timeout 1800 cargo test -p podrunner-broker-fake --test hosted -- --ignored --nocapture" \
            < /dev/null 2>&1 | tee "$RUNNER_TEMP/hosted-job.txt" || rc=$?
          {
            echo "## The canned job in the runner layer"
            echo
            echo '```'
            grep -E 'Z hosted-[a-z-]+=|^test result' "$RUNNER_TEMP/hosted-job.txt" || echo "(no line of the job)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
