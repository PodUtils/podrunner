name: gate

# The checks of each push to main and each pull request
# (PodUtils/podrunner#12, docs/development.md):
#
# * lint: format, clippy with -D warnings, docs, the fuzz targets, the size
#   of each Rust file (at most 500 lines), no agent attribution line in a
#   new commit, the test of the installer (scripts/test-install.sh).
# * test: the tests of the workspace.
# * record: the tests of the checker, and `cargo todo check`.
# * static: the release build of each binary for x86_64 and aarch64 musl,
#   with zig as the C compiler; no PT_INTERP and no NEEDED entry
#   (scripts/check-static.sh), and a planted dynamic binary must fail.
# * deny: cargo-deny over Cargo.lock; a denied license must fail.
# * go: the Go parts: format, vet, tests, a static build.
# * all: the one status to require. It fails when a job failed or was
#   skipped.
#
# Each action is pinned by its commit. No job may write to the repository.
# The toolchain and the musl targets come from rust-toolchain.toml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # An advisory can come while the tree does not change.
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4
  PODCRATES_TAG: v0.86.0
  CHECK_MAN_SHA256: a8a4da701fb5e6ba9dfb4eed470feb07f53fdf6358da116bb967c8705ae97f07
  DENY_VERSION: "0.20.2"
  DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of the push, for the check of the messages.
          fetch-depth: 50
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --workspace --all-features
      # The fuzz targets (fuzz/, a workspace of its own) build on stable
      # Rust; the build script of libFuzzer needs the C++ compiler of the
      # runner. The stable test runs each target on its seeds and their
      # mutations.
      - name: The fuzz targets build and survive their seeds
        working-directory: fuzz
        run: |
          set -eu
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib
      - name: The size of the Rust files
        run: |
          python3 -I scripts/check-size.py
          python3 -I scripts/check-size.py --self-test
      - name: The stale and narrative text of the documents
        run: |
          python3 -I scripts/check-docs.py
          python3 -I scripts/check-docs.py --self-test
      # T-528: the summary of user-gate.yml on a fixture of two lanes.
      - name: The summary of the user-path gate
        run: python3 -I scripts/user-gate-summary.py --self-test
      # T-660: the times of serve:warm from a journal, and the message of a
      # missing line. T-509: the step of serve:job:engine:microvm with
      # stand-ins of docker, httpd and wget, and its planted defects.
      - name: The parts of the user-path gate with no host
        run: python3 -I scripts/user-gate.py --self-test
      # T-506: the WebSocket echo server and the attach client of the
      # sandbox check of the user-path gate, against each other.
      - name: The WebSocket attach of the user-path gate
        run: python3 -I scripts/ws-echo.py --self-test
      # T-582: the checks of the boot of hosted-boot.yml on a good boot, a
      # run that exits 125 with no trace, and a boot with no marker.
      - name: The checks of the hosted boot
        run: python3 -I scripts/hosted/boot-checks.py --self-test
      # T-541: the runner layer of the hosted snapshot on a fixture tarball:
      # the paths, the owner, the .env, the links, and each refusal.
      - name: The runner layer of the hosted snapshot
        run: python3 -I scripts/hosted/runner-layer.py --self-test
      # The other scripts of the hosted snapshot: hosted-parity.yml runs
      # them each day, and a push must not wait a day for a fault.
      - name: The other scripts of the hosted snapshot
        run: |
          for s in diff scrub plan c1 oci slice watch; do
            python3 -I "scripts/hosted/$s.py" --self-test
          done
          timeout 120 python3 -I scripts/hosted/push-blob.py --self-test
          # The subcommands that capture.sh gives to scrub.py, and the
          # shell of the hosted scripts.
          sh scripts/hosted/calls.sh
          sh scripts/shellcheck.sh scripts/hosted/*.sh
          # apt with the sources of Ubuntu only (T-741).
          sh scripts/apt-ubuntu-test.sh
          sh scripts/shellcheck.sh scripts/apt-ubuntu.sh scripts/apt-ubuntu-test.sh
      # T-252: each workflow, with the pinned actionlint and the pinned
      # ShellCheck (scripts/actionlint.sh).
      - name: The workflows
        run: sh scripts/actionlint.sh .github/workflows/*.yml
      # T-499: the runner image release: the SHA-256 of the notes of
      # actions/runner, the tag, the alarm of a runner with no image, and
      # the manifest and the notes of a fixture archive.
      - name: The runner image release
        run: python3 -I scripts/runner-release.py --self-test
      # T-553: the images of a release on ghcr.io: two fake binaries and two
      # fixture archives, pushed to a registry in memory and read back, and
      # each refusal.
      - name: The images of a release on ghcr.io
        run: timeout 120 python3 -I scripts/ghcr.py --self-test
      # T-202: the installer of the local mode against a local fixture, its
      # pins against images/*.toml (a changed pin must fail), and shellcheck
      # of the pinned version (scripts/shellcheck.sh, T-251).
      - name: The installer
        run: |
          set -eu
          sh scripts/test-install.sh
      # T-247: the newest notes of a release name the level of the proof of
      # each claim.
      - name: The levels of proof of the notes
        run: sh scripts/check-notes.sh --latest
      - name: No agent attribution line in a commit
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          sh scripts/check-commit-msg.sh --self-test
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            revs=$(git rev-list "$BEFORE..HEAD")
          else
            revs=$(git rev-list -1 HEAD)
          fi
          # shellcheck disable=SC2086 # $revs holds one word for each commit
          sh scripts/check-commit-msg.sh --rev $revs

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: Test
        run: |
          set -eu
          # The tests get a TMPDIR of their own and leave nothing in it
          # (T-591).
          # The default name (tmp.XXXXXXXXXX) has a dot and a random word:
          # a unit under it must pass the secret check of pod-unit (T-602).
          tmp=$(mktemp -d)
          TMPDIR=$tmp cargo test --locked --workspace --all-features
          left=$(ls -A "$tmp")
          if [ -n "$left" ]; then
            echo "the tests left these entries in their temp directory:"
            echo "$left"
            exit 1
          fi
      # T-509 (githome's G-38): the source of githome (the pinned
      # pod-fake-githome of podcrates, images/fake-githome.toml) passes each
      # test of source-conformance; a red gate blocks release.yml.
      - name: githome's source passes source-conformance
        run: |
          set -eu
          cargo build --locked -q -p podrunner
          # shellcheck disable=SC2012 # the names are cargo paths with no odd characters
          bin=$(ls target/*/debug/podrunner target/debug/podrunner 2> /dev/null | head -n 1)
          sh scripts/githome-conformance.sh "$bin" "$RUNNER_TEMP/githome"

  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parent of the commit: a citation that a change left behind.
          fetch-depth: 2
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: The record agrees
        run: cargo run --locked -q -p podrunner-todo -- check
      - name: No citation left behind by the last commit
        if: github.event_name == 'push'
        run: cargo run --locked -q -p podrunner-todo -- check --base HEAD~1
      # The design copy (GitHub #14): its own checks and their planted
      # defects (docs/design/verify.sh), and no detail of a machine or an
      # account of the owner.
      - name: The design copy
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/venv"
          sh scripts/retry.sh "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.26.0
          PATH="$RUNNER_TEMP/venv/bin:$PATH" bash docs/design/verify.sh
          # The schema of podrunner.toml (T-479).
          "$RUNNER_TEMP/venv/bin/python3" -I scripts/check-config-schema.py --self-test
          sh scripts/check-design.sh --self-test
          sh scripts/check-design.sh

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: zig and cargo-zigbuild
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/zig"
          sh scripts/fetch-zig.sh "$ZIG_VERSION" "$ZIG_SHA256" "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          sh scripts/retry.sh cargo install --locked --quiet cargo-zigbuild --version "$ZIGBUILD_VERSION"
      - name: Build
        run: PODRUNNER_COMMIT=$(git rev-parse --short=12 HEAD) cargo zigbuild --locked --release --target ${{ matrix.target }} -p podrunner
      - name: The binary is static
        run: |
          set -eu
          exe=target/${{ matrix.target }}/release/podrunner
          sh scripts/check-static.sh "$exe"
          file "$exe"
          echo "| ${{ matrix.target }} podrunner | $(wc -c < "$exe") bytes |" >> "$GITHUB_STEP_SUMMARY"
      - name: The binary runs
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: target/${{ matrix.target }}/release/podrunner --version | grep -F "($(git rev-parse --short=12 HEAD))"
      # T-645: the man page of the binary under groff and mandoc, with
      # check-man.sh of podcrates (the tag of the pod-* crates, its SHA-256
      # checked). It also lints the page of a release: scripts/release-assets.sh
      # man writes it.
      - name: The man page renders under groff and mandoc
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -eu
          sh scripts/retry.sh sh scripts/apt-ubuntu.sh update
          sh scripts/retry.sh sh scripts/apt-ubuntu.sh install groff-base mandoc
          exe=$PWD/target/${{ matrix.target }}/release/podrunner
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/check-man.sh" \
            "https://raw.githubusercontent.com/PodUtils/podcrates/$PODCRATES_TAG/scripts/check-man.sh"
          echo "$CHECK_MAN_SHA256  $RUNNER_TEMP/check-man.sh" | sha256sum -c --status -
          sh "$RUNNER_TEMP/check-man.sh" "$exe"
          sh scripts/release-assets.sh man "$exe" "$RUNNER_TEMP/man"
          mandoc -Tlint -W warning "$RUNNER_TEMP/man/podrunner.1"
          groff -man -Tascii -ww -z "$RUNNER_TEMP/man/podrunner.1"
          # The planted defect: a header with no date is a warning of mandoc.
          sed '1s/ "[0-9-]*" / "" /' "$RUNNER_TEMP/man/podrunner.1" > "$RUNNER_TEMP/man/dateless.1"
          if mandoc -Tlint -W warning "$RUNNER_TEMP/man/dateless.1" > /dev/null 2>&1; then
            echo "mandoc -Tlint passed a page with no date"
            exit 1
          fi
      - name: A dynamic binary fails the check
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          set -u
          if sh scripts/check-static.sh /bin/ls; then
            echo "check-static.sh passed a dynamic binary"
            exit 1
          fi

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo-deny, from its release, checked by its SHA-256
        run: |
          set -eu
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          sh scripts/retry.sh curl -qfsSL -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version
      - name: Advisories, licenses, bans and sources
        run: cargo deny --locked check advisories licenses bans sources
      - name: A denied license fails
        run: |
          set -u
          sed "/\"0BSD\",/d" deny.toml > "$RUNNER_TEMP/deny.toml"
          if cargo deny --locked --config "$RUNNER_TEMP/deny.toml" check licenses > "$RUNNER_TEMP/plant.log" 2>&1; then
            echo "the check passed with 0BSD denied"
            exit 1
          fi
          grep -m1 'failed to satisfy license requirements' "$RUNNER_TEMP/plant.log"

  # The Go parts (tools/fake-scaleset, tools/scaleset-sidecar): format,
  # vet, tests, a static build with no cgo, and the source tests of the
  # sidecar on the fake. The go.mod names the
  # toolchain; the go command fetches it.
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: auto
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The fake scale-set service
        working-directory: tools/fake-scaleset
        run: |
          set -eu
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          # The race detector needs cgo; the build below stays static.
          CGO_ENABLED=1 go test -race ./...
          go build -o "$RUNNER_TEMP/fake-scaleset" .
          sh "$GITHUB_WORKSPACE/scripts/check-static.sh" "$RUNNER_TEMP/fake-scaleset"
      - name: The scale-set sidecar
        working-directory: tools/scaleset-sidecar
        env:
          PODRUNNER_FAKE_SCALESET: ${{ runner.temp }}/fake-scaleset
        run: |
          set -eu
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          # The race detector needs cgo; the build below stays static.
          CGO_ENABLED=1 go test -race ./...
          go build -o "$RUNNER_TEMP/scaleset-sidecar" .
          sh "$GITHUB_WORKSPACE/scripts/check-static.sh" "$RUNNER_TEMP/scaleset-sidecar"
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      - name: The source tests and a run of slots against the sidecar on the fake
        env:
          PODRUNNER_FAKE_SCALESET: ${{ runner.temp }}/fake-scaleset
          PODRUNNER_SCALESET_SIDECAR: ${{ runner.temp }}/scaleset-sidecar
        run: |
          set -eu
          cargo test --locked -p podrunner-source --test scaleset -- --ignored
          # slots, mint, sign and the sidecar: a fork pull request on the
          # trusted set is withdrawn and never acquired; a member job runs.
          cargo test --locked -p podrunner --test scaleset -- --ignored
          # The gates G-H2 and G-H3 in their offline form (T-071).
          cargo test --locked -p podrunner --test live -- --include-ignored

  all:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [lint, test, record, static, deny, go]
    steps:
      - name: Each job passed
        run: |
          set -eu
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.record.result }}" "${{ needs.static.result }}" "${{ needs.deny.result }}" "${{ needs.go.result }}"; do
            [ "$r" = success ] || { echo "a job ended: $r"; exit 1; }
          done
