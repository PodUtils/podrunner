name: user-gate

# The user-path gate (T-243, T-244; docs/maintenance.md, "A release"). It
# makes the files of a release as release.yml makes them, with the same
# script (scripts/release-assets.sh), and uses them as a user with no root
# on each host class (a lane):
#
# * build, assets: the static binaries of x86_64 and aarch64, the
#   installer with the pins of the version, the bundles, and the runner
#   image archives of the green runner-image.yml run of this commit (the
#   input images_run, else the latest one; no such run refuses the gate).
# * lanes: each lane takes the assets as one artifact and runs
#   scripts/user-gate.py as a user with no root (scripts/lab/nonroot.sh)
#   on its host class (scripts/lab/): the quick start of docs/install.md as
#   it is written (online, from a local HTTP server with the paths of the
#   release), the bundle with no network, --full, `podrunner doctor --run`
#   and a run of hello.yml on each executor, and the corpus of real
#   projects at pinned commits (scripts/corpus/user-gate.tsv) against the
#   result of github.com.
# * summary: one table, check x lane, in the summary of the run, and one
#   table, row x lane, with the times of the rows that have them (T-528).
#
# release.yml refuses a version with no green run of this workflow on its
# commit. With the input version, the files have the version of the
# release; else the version is that of Cargo.toml with -gate.RUN_ID.

run-name: user-gate ${{ inputs.version || 'gate' }}

on:
  workflow_dispatch:
    inputs:
      images_run:
        description: "The id of a green runner-image.yml run (of an older commit when images/ is the same); empty: the green run of this commit, else the gate refuses"
        required: false
        default: ""
      version:
        description: "The version of the files, X.Y.Z-beta.N of the release (empty: X.Y.Z-gate.RUN_ID)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIGBUILD_VERSION: 0.23.4

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      images: ${{ steps.p.outputs.images }}
      version: ${{ steps.p.outputs.version }}
    env:
      IMAGES_RUN: ${{ inputs.images_run }}
      VERSION_IN: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image archives and the version
        id: p
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          have=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          version=${VERSION_IN:-$have-gate.$GITHUB_RUN_ID}
          case $version in
            "$have" | "$have"-*) ;;
            *) echo "the version $version does not name the version $have of Cargo.toml"; exit 1 ;;
          esac
          # The rule of images_run, the same in release.yml (T-626).
          images=$(sh scripts/images-run.sh "$IMAGES_RUN")
          echo "the files of $version at $sha; the images of runner-image.yml run $images" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zig and cargo-zigbuild
        run: sh scripts/release-assets.sh tools
      - name: The static binaries, as release.yml makes them
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: sh scripts/release-assets.sh binaries ${{ matrix.target }} "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  assets:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGES: ${{ needs.prepare.outputs.images }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: The image archives of the runner-image.yml run
        run: sh scripts/release-assets.sh images "$IMAGES" dist
      - name: The installer, its pins and the bundles, as release.yml makes them
        run: |
          set -eu -o pipefail
          sh scripts/release-assets.sh local-mode "$VERSION" dist out | tee -a "$GITHUB_STEP_SUMMARY"
          # The files of the job build of release.yml.
          # T-692: the page too; the installer takes it by SHA256SUMS.
          cp dist/podrunner-*-linux-musl* dist/scaleset-sidecar-*-linux-musl* dist/podrunner.1* out/
          (cd out && sha256sum -c ./*.sha256)
          # T-523: the installer takes no file of a release with no
          # release-index.json and SHA256SUMS; the job dry of release.yml
          # writes them in the same way (no signature).
          sh scripts/release-assets.sh index "$VERSION" out
          sh scripts/release-assets.sh sums out
          sh scripts/release-assets.sh check out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-gate-assets
          path: out/
          if-no-files-found: error
          retention-days: 7

  lanes:
    needs: assets
    runs-on: ubuntu-24.04
    # The corpus runs each job on each executor, one at a time.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # LAB: the scripts of scripts/lab/ that make the host class, then
        # the user with no root. A new host class of a report is a new lane
        # (AGENTS.md, section 12). T-244, next: bind-denied (a seccomp
        # filter of bind and getsockname: `podvm lab run`, PodUtils/podvm#424)
        # and an authenticated proxy (podnet), when podvm and podnet give
        # them.
        include:
          - lane: plain
            lab: sh scripts/lab/nonroot.sh --
            executors: podvm,runner-dir,microvm
          - lane: small-tmp
            lab: sh scripts/lab/small-tmp.sh -- sh scripts/lab/nonroot.sh --
            executors: podvm,runner-dir
          - lane: userns-off
            lab: sh scripts/lab/userns-off.sh -- sh scripts/lab/nonroot.sh --
            executors: podvm,runner-dir
          # The namespace rung of podvm (T-564): no other lane gives it,
          # since the runners restrict user namespaces by AppArmor. The
          # units get the socket volume there, and from podvm 0.2.0-beta.37
          # the container hooks (T-532; runner-image.yml measures them).
          - lane: userns-on
            lab: sh scripts/lab/userns-on.sh -- sh scripts/lab/nonroot.sh --
            executors: podvm
            podvm_lab: bind-denied,getsockname-denied
            want_rung: namespace
            # T-566: a trusted runner job of githome's fake source through
            # serve on the podvm kind with the hold and the confine layer.
            serve_kinds: podvm
          # A hard limit of file size of 1 GiB (`ulimit -f 1048576` in bash;
          # T-144, T-632, T-638): the runner-dir route runs with W^X off;
          # the podvm route runs when its image is under the threshold of
          # run_local/dry.rs, else `run` exits 78 and names root and
          # --runner-dir (the check fsize; the podvm checks are skips).
          - lane: fsize-1g
            lab: sh scripts/lab/fsize.sh -- sh scripts/lab/nonroot.sh --
            executors: podvm,runner-dir
          # Ctrl-C of a `container:` job in a long step (T-639, T-644):
          # `podrunner run` gets SIGINT after the step printed its line; it
          # must end with 130 within 60 s, print `cancelled` for each job,
          # and leave no process, container or directory of the unit (the
          # check cancel:container). The lane takes no corpus row.
          - lane: cancel-container
            lab: sh scripts/lab/nonroot.sh --
            executors: podvm
            no_corpus: "1"
          - lane: inherited-fds
            lab: sh scripts/lab/nonroot.sh -- bash scripts/lab/inherited-fds.sh --
            executors: podvm,runner-dir
          # A host with an HTTPS proxy only, that intercepts TLS (the
          # adversarial QA, T-265, T-284).
          - lane: proxy-only
            lab: sh scripts/lab/proxy-only.sh -- sh scripts/lab/nonroot.sh --
            executors: podvm,runner-dir
          # The host of the user QA of beta.7 (T-371, F1, F4): the proxy
          # asks for a login and resolves each name; the user has no
          # resolver of its own.
          - lane: proxy-only-dns
            lab: env LAB_NO_DNS=1 LAB_PROXY_AUTH=1 sh scripts/lab/proxy-only.sh -- sh scripts/lab/nonroot.sh --
            executors: podvm,runner-dir
          # podvm 0.2.0-beta.24 makes the class around podrunner only (the
          # local server of the lane binds): the install, then doctor and a
          # run in `podvm lab run` (T-213), and a run with --vnet (T-220, a measure).
          - lane: bind-denied
            lab: sh scripts/lab/nonroot.sh --
            executors: ""
            podvm_lab: bind-denied,getsockname-denied
          # The host class of githome's pool (T-527): incusd and KVM; the
          # user is in the group of the socket of incusd. config init,
          # check, doctor, print-unit and serve on each kind.
          - lane: serve-incus-kvm
            lab: sh scripts/lab/nonroot.sh --
            # T-528: the local mode on the incus kind (hello and rbg-gate).
            executors: incus
            serve_kinds: incus,microvm
            # T-487: two jobs cold and two warm through serve on each kind.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: user-gate-assets
          path: ${{ runner.temp }}/assets
      # The images, the stores, the clones and the builds of the corpus
      # need more than the free disk of a hosted runner.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      # The user of the lane cannot read the home of the runner user.
      - name: The files for the user of the lane
        run: |
          set -eu
          sudo install -d -m 0755 /opt/user-gate
          sudo cp -a "$GITHUB_WORKSPACE" /opt/user-gate/src
          sudo mv "$RUNNER_TEMP/assets" /opt/user-gate/assets
          sudo chmod -R a+rX /opt/user-gate
          sudo install -d -m 1777 /opt/user-gate/out
      # The machine tier of podvm needs KVM and QEMU (as in runner-image.yml).
      - name: KVM and QEMU for --microvm
        if: contains(matrix.executors, 'microvm') || contains(matrix.serve_kinds, 'microvm')
        run: |
          set -eu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          sh scripts/retry.sh sudo apt-get -qq update
          sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends qemu-system-x86
      # incusd from apt, with its defaults; the user of the lane is in the
      # group of its socket and has no root (T-527).
      - name: incus for the serve lane
        if: contains(matrix.serve_kinds, 'incus')
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get -qq update
          sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends incus dnsmasq-base
          sudo incus admin init --minimal
          id labuser >/dev/null 2>&1 || sudo useradd -m -s /bin/sh labuser
          sudo usermod -aG incus-admin labuser
      # T-507: the file of config init against schemas/config.v1.json, in a
      # venv that the user of the lane can run.
      - name: The checker of the schema of podrunner.toml
        if: matrix.serve_kinds != ''
        run: |
          set -eu
          sudo python3 -m venv /opt/user-gate/venv
          sudo sh scripts/retry.sh /opt/user-gate/venv/bin/pip install --quiet jsonschema==4.26.0
          sudo chmod -R a+rX /opt/user-gate/venv
          # T-527: an address of TEST-NET-1 on the loopback for the fake
          # GitHub: pod-broker refuses the private range of the runner's
          # own address (10.x), with no policy that lifts it.
          sudo ip addr add 192.0.2.10/32 dev lo
      - name: The lane, as a user with no root
        working-directory: /opt/user-gate/src
        env:
          LANE: ${{ matrix.lane }}
          LAB: ${{ matrix.lab }}
          EXECUTORS: ${{ matrix.executors }}
          PODVM_LAB: ${{ matrix.podvm_lab }}
          SERVE_KINDS: ${{ matrix.serve_kinds }}
          WANT_RUNG: ${{ matrix.want_rung }}
          NO_CORPUS: ${{ matrix.no_corpus }}
          # The jobs of the corpus call the API of GitHub (setup-node, the
          # releases of tools): the token of this run (contents: read) keeps
          # them under the rate limit of a shared address (T-253).
          PODRUNNER_GATE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # shellcheck disable=SC2086 # LAB is a command with its words.
          $LAB python3 -I scripts/user-gate.py lane --lane "$LANE" --assets /opt/user-gate/assets \
            --out /opt/user-gate/out --executors "$EXECUTORS" --podvm-lab "${PODVM_LAB:-}" \
            --serve-kinds "${SERVE_KINDS:-}" --want-rung "${WANT_RUNG:-}" ${NO_CORPUS:+--no-corpus} \
            --schema-python "$(test -x /opt/user-gate/venv/bin/python3 && echo /opt/user-gate/venv/bin/python3)" \
            --broker-address "$(ip -4 -o addr show dev lo | grep -q ' 192.0.2.10/' && echo 192.0.2.10)"
      - name: The results can be read
        if: always()
        run: sudo chmod -R a+rX /opt/user-gate/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lane-${{ matrix.lane }}
          path: /opt/user-gate/out/
          retention-days: 14

  summary:
    needs: lanes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lane-*
          path: results
      - name: One table, check x lane
        run: |
          set +e
          python3 -I scripts/user-gate-summary.py --self-test || exit 1
          # The lanes of the matrix of the job lanes: a lane with no results
          # fails the gate.
          python3 -I scripts/user-gate-summary.py --lanes plain,small-tmp,userns-off,userns-on,fsize-1g,cancel-container,inherited-fds,proxy-only,proxy-only-dns,bind-denied,serve-incus-kvm results > table.md
          rc=$?
          cat table.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
