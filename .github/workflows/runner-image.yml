name: runner-image

# The unit image of the official runner (GitHub #30): the version and the
# digest of each tarball come from images/runner/runner.toml (a reviewed
# file). Each architecture builds on its own GitHub-hosted runner, to an
# OCI archive with the digest of its manifest; a host imports the archive
# and pins that digest (docs/configuration.md, [pin]).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/podvm.toml
      - images/podnet.toml
      - scripts/measure-podnet-pod.sh
      - scripts/measure-container-verbs.sh
      - scripts/measure-machine.sh
      - scripts/measure-incus.sh
      - scripts/measure-engine.sh
      - crates/podrunner-fake/**
      - images/runner/**
      - scripts/runner-audit.sh
      - crates/podrunner-hook/relay/**
      - crates/podrunner-podvm/**
      - crates/podrunner-microvm/**
      - crates/podrunner-incus/**
      - crates/podrunner-slots/**
      - crates/podrunner-unit/**
      - crates/podrunner-broker-fake/**
      - crates/podrunner-local/**
      - crates/podrunner/src/run_local.rs
      - crates/podrunner/src/run_local/**
      - crates/podrunner/tests/local/**
      - .github/workflows/runner-image.yml

permissions:
  contents: read

jobs:
  # T-082: the NuGet advisories of the pinned runner against the reviewed
  # list images/runner/advisories.txt.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone the runner tag
        run: |
          set -eu
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("images/runner/runner.toml", "rb"))["version"])')
          sh scripts/retry.sh git clone -q --depth 1 --branch "v$version" https://github.com/actions/runner.git "$RUNNER_TEMP/runner-src"
          echo "RUNNER_SRC=$RUNNER_TEMP/runner-src" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ env.RUNNER_SRC }}/src/global.json
      - name: The advisories of the runner are the reviewed ones
        run: sh scripts/runner-audit.sh "$RUNNER_SRC" images/runner/advisories.txt | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runs-on: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    # The x86_64 job runs each podvm suite twice, the guest tests, the
    # parity suite in guests with an engine and the measures: up to about
    # 120 minutes on a hosted runner.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version and the digest of the tarball
        id: pin
        run: |
          set -eu
          python3 -I - "${{ matrix.arch }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, tomllib
          pin = tomllib.load(open("images/runner/runner.toml", "rb"))
          print("version=" + pin["version"])
          print("sha256=" + pin["sha256"][sys.argv[1]])
          PY
      - name: Build the OCI archive
        id: build
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # The host network for the build: the resolver of the build
          # container failed for the Ubuntu mirrors.
          docker buildx create --use --name podrunner --driver-opt network=host > /dev/null
          # No attestation: the archive holds one image manifest, which
          # podvm load takes.
          sh scripts/retry.sh docker buildx build -f images/runner/Dockerfile --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg "RUNNER_VERSION=$VERSION" --build-arg "RUNNER_SHA256=$SHA256" \
            --output "type=oci,dest=runner-$ARCH.tar" .
          sha256sum "runner-$ARCH.tar" | tee "runner-$ARCH.tar.sha256"
          mkdir oci && tar -xf "runner-$ARCH.tar" -C oci
          digest=$(python3 -I -c 'import json; print(json.load(open("oci/index.json"))["manifests"][0]["digest"])')
          echo "the image: runner@$digest (runner $VERSION, $ARCH)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The import of the archive into a podvm store as a user with no root
      # (the user of the runner), and a start of the runner in it.
      - name: Import into a podvm store
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -eu
          eval "$(python3 -I - "$ARCH" <<'PY'
          import sys, tomllib
          pin = tomllib.load(open("images/podvm.toml", "rb"))
          print(f"podvm_version={pin['version']} podvm_sha256={pin['sha256'][sys.argv[1]]}")
          PY
          )"
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/podvm" \
            "https://github.com/PodUtils/podvm/releases/download/v$podvm_version/podvm-$ARCH"
          echo "$podvm_sha256  $RUNNER_TEMP/podvm" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/podvm"
          test "$(id -u)" -ne 0
          export PODVM_STORE="$RUNNER_TEMP/store"
          # podvm registers the image under the ref name of the index.
          python3 -I - oci "runner:$VERSION" <<'PY'
          import json, sys
          p = sys.argv[1] + "/index.json"
          d = json.load(open(p))
          d["manifests"][0].setdefault("annotations", {})["org.opencontainers.image.ref.name"] = sys.argv[2]
          json.dump(d, open(p, "w"))
          PY
          # podvm takes the files of the layout only, with no directory entry.
          (cd oci && find . -type f | sed 's#^\./##' | sort | tar -cf ../load.tar --no-recursion -T -)
          "$RUNNER_TEMP/podvm" probe 2>&1 | sed -n 2p
          "$RUNNER_TEMP/podvm" load -i load.tar
          "$RUNNER_TEMP/podvm" images
          image="runner@${{ steps.build.outputs.digest }}"
          check='test -x /home/runner/run.sh && test -x /home/runner/hooks/podrunner-hook.sh && echo the runner files are in the image'
          # T-051: on aarch64 too, with the aarch64 interposer of podvm.
          "$RUNNER_TEMP/podvm" run --rm "$image" /bin/sh -c "$check"
          echo "PODRUNNER_PODVM=$RUNNER_TEMP/podvm" >> "$GITHUB_ENV"
          echo "PODRUNNER_PODVM_IMAGES=$PODVM_STORE" >> "$GITHUB_ENV"
          echo "PODRUNNER_RUNNER_IMAGE=$image" >> "$GITHUB_ENV"
          # The payload image of the unit conformance suite: it has sh,
          # setsid, env and sleep.
          echo "PODRUNNER_PODVM_IMAGE=$image" >> "$GITHUB_ENV"
          # The podnet of the egress hold (T-065), pinned in images/podnet.toml.
          eval "$(python3 -I - "$ARCH" <<'PY'
          import sys, tomllib
          pin = tomllib.load(open("images/podnet.toml", "rb"))
          print(f"podnet_version={pin['version']} podnet_sha256={pin['sha256'][sys.argv[1]]}")
          PY
          )"
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/podnet" \
            "https://github.com/PodUtils/podnet/releases/download/v$podnet_version/podnet-$ARCH-unknown-linux-musl"
          echo "$podnet_sha256  $RUNNER_TEMP/podnet" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/podnet"
          echo "PODRUNNER_PODNET=$RUNNER_TEMP/podnet" >> "$GITHUB_ENV"
          # The job container of the hook test: the same image (it has tail).
          echo "PODRUNNER_JOB_IMAGE=$image" >> "$GITHUB_ENV"
      # The machine tier of podvm needs KVM (the udev rule of podvm's
      # kvm.yml) and QEMU. A step of its own: a failed step before it must
      # not skip the setup of the later steps that run under !cancelled().
      - name: KVM and QEMU for the machine tier
        if: matrix.arch == 'x86_64'
        run: |
          set -eu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          sh scripts/retry.sh sudo apt-get -qq update
          sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends qemu-system-x86
      # T-026: the podvm driver runs the image with the JIT files of the
      # fake broker; the runner takes one canned job and completes it.
      # T-035: a container job through the hooks of the podvm unit.
      # T-053, T-063: the unit conformance suite on the podvm driver.
      - name: The runner in a podvm unit runs a canned job and a container job
        if: matrix.arch == 'x86_64'
        run: |
          set -eu
          sh scripts/retry.sh rustup toolchain install
          cargo test -p podrunner-broker-fake --test podvm -- --ignored --nocapture
          # T-090: podrunner run runs the suite of the local mode, each job
          # in a fresh podvm unit of the runner image. T-095: each unit is
          # held; it reaches only the fake broker on the loopback.
          timeout 1200 cargo run -q -p podrunner -- run crates/podrunner/tests/local/suite.yml \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" --checkout . \
            --podnet "$PODRUNNER_PODNET" | tee "$RUNNER_TEMP/local.txt"
          test "$(grep -c '^ok ' "$RUNNER_TEMP/local.txt")" = 8
          # T-132: the same suite with three jobs at a time, each in its own unit.
          timeout 1200 cargo run -q -p podrunner -- run crates/podrunner/tests/local/suite.yml \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" --checkout . \
            --jobs 3 | tee "$RUNNER_TEMP/local-jobs.txt"
          test "$(grep -c '^ok ' "$RUNNER_TEMP/local-jobs.txt")" = 8
          # T-093: a container: job and a Docker step through the hooks.
          sed "s|IMAGE|$PODRUNNER_RUNNER_IMAGE|" crates/podrunner/tests/local/containers.yml > "$RUNNER_TEMP/containers.yml"
          timeout 1200 cargo run -q -p podrunner -- run "$RUNNER_TEMP/containers.yml" \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" | tee "$RUNNER_TEMP/containers.txt"
          test "$(grep -c '^ok ' "$RUNNER_TEMP/containers.txt")" = 2
          # T-146: a container job leaves a locked directory; two runs in a
          # row pass, and no unit leaves residue (a residue fails the job).
          sed "s|IMAGE|$PODRUNNER_RUNNER_IMAGE|" crates/podrunner/tests/local/rerun.yml > "$RUNNER_TEMP/rerun.yml"
          for n in 1 2; do
            timeout 900 cargo run -q -p podrunner -- run "$RUNNER_TEMP/rerun.yml" \
              --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" | tee "$RUNNER_TEMP/rerun-$n.txt"
            grep -qx 'ok      root' "$RUNNER_TEMP/rerun-$n.txt"
          done
          # T-095: the egress of a held unit: no host but the ones of --allow.
          # The plant: with no hold the same step reaches the host and fails.
          run_egress() {
            timeout 600 cargo run -q -p podrunner -- run crates/podrunner/tests/local/egress.yml \
              --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" "$@" || true
          }
          run_egress --podnet "$PODRUNNER_PODNET" | tee "$RUNNER_TEMP/egress.txt"
          grep -qx 'ok      denied' "$RUNNER_TEMP/egress.txt"
          run_egress | tee "$RUNNER_TEMP/egress-plant.txt"
          grep -q '^failure denied' "$RUNNER_TEMP/egress-plant.txt"
          # T-096: tar in a unit of the runner image; each form prints one
          # line and must pass. The host gets an empty directory at each
          # absolute path of -C: a unit must not write into it. A second
          # pass has no such host directory (the failure of podvm beta.6).
          tar_forms() {
          PODVM_STORE="$PODRUNNER_PODVM_IMAGES" "$PODRUNNER_PODVM" run --rm "$PODRUNNER_RUNNER_IMAGE" /bin/bash -c '
            # /tmp, and the workspace path of the failed step (T-096).
            for b in /tmp /home/runner/_work/app; do
              mkdir -p "$b" && cd "$b" && echo x > f && tar -cf x.tar f && gzip -c x.tar > x.tgz
              m() { rm -rf d && mkdir -p d && if ( eval "$2" ) > /dev/null 2>&1 && test -f d/f; then echo "tar $b $1 ok"; else echo "tar $b $1 failed"; fi; }
              m -C "tar -xf x.tar -C d"
              m -C-z "tar -xzf x.tgz -C d"
              m -C-abs "tar -xzf x.tgz -C $b/d"
              m -C-abs-plain "tar -xf x.tar -C $b/d"
              m cd "cd d && tar -xf ../x.tar"
              m cd-gzip "cd d && gzip -dc ../x.tgz | tar -xf -"
              m cd-z "cd d && tar -xzf ../x.tgz"
            done' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/tar.txt"
          }
          for h in /tmp/d /home/runner/_work/app/d; do rm -rf "$h"; mkdir -p "$h"; done
          tar_forms
          for h in /tmp/d /home/runner/_work/app/d; do
            if [ -z "$(ls -A "$h")" ]; then echo "tar host $h untouched"; else echo "tar host $h written: $(ls -A "$h" | tr '\n' ' ')"; fi
          done | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/tar.txt"
          rm -rf /tmp/d /home/runner/_work/app/d
          tar_forms
          if grep -E 'failed|written' "$RUNNER_TEMP/tar.txt"; then exit 1; fi
          test "$(grep -c ' ok$' "$RUNNER_TEMP/tar.txt")" = 28
          cargo test -p podrunner-podvm --test conformance --no-run
          timeout 900 cargo test -p podrunner-podvm --test conformance -- --ignored --nocapture
          # T-065: the egress hold of a unit under podnet pod.
          sh scripts/measure-podnet-pod.sh "$PODRUNNER_PODNET" "$PODRUNNER_PODVM" "$RUNNER_TEMP/podnet-measure"
          timeout 300 cargo test -p podrunner-podvm --test hold -- --ignored --nocapture
          # T-065 step 4: a held runner reaches an allowed host and not a denied one.
          timeout 600 cargo test -p podrunner-broker-fake --test held -- --ignored --nocapture
          # T-061: an absolute link resolves in the rootfs of the unit.
          timeout 300 cargo test -p podrunner-podvm --test links -- --ignored --nocapture
          # T-079: the same under the confine layer of podvm, proven first.
          PODRUNNER_PODVM_CONFINE=1 timeout 900 cargo test -p podrunner-podvm --test conformance -- --ignored --nocapture
          PODRUNNER_PODVM_CONFINE=1 cargo test -p podrunner-broker-fake --test podvm -- --ignored --nocapture
          sh scripts/measure-podvm-confine.sh "$PODRUNNER_PODVM" "$RUNNER_TEMP/confine"
          # T-078: the labels and the run report of podvm.
          timeout 300 cargo test -p podrunner-podvm --test report -- --ignored --nocapture
          # T-062: a step through exec cannot write the externals (:ro).
          sh scripts/measure-container-verbs.sh "$PODRUNNER_PODVM" "$RUNNER_TEMP/verbs" | tee "$RUNNER_TEMP/verbs.txt"
          grep -qx 'externals-read-only ok' "$RUNNER_TEMP/verbs.txt"
      # T-130: an image by tag is pulled into the store and pinned by the
      # lock beside the workflow; the runner gets the digest. Where chroot is
      # denied, podvm runs the glibc image detached from beta.17 (T-156).
      # Its own step, so that a failure does not skip the podvm step.
      - name: An image by tag in a podvm unit
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        run: |
          set -eu
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/tags" && cp crates/podrunner/tests/local/tags.yml "$RUNNER_TEMP/tags/"
          timeout 900 cargo run -q -p podrunner -- run "$RUNNER_TEMP/tags/tags.yml" \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" | tee "$RUNNER_TEMP/tags.txt"
          grep -q '^docker://busybox:1.37.0 sha256:' "$RUNNER_TEMP/tags/podrunner-actions.lock"
          grep -qx 'ok      tagged' "$RUNNER_TEMP/tags.txt"
      # T-138: the work directory of the runner in a podvm unit is a host
      # directory; the workspace of the job goes to DIR/JOB. A measure.
      - name: The export of a workspace from a podvm unit (a measure)
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        continue-on-error: true
        run: |
          set -eu
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/export"
          printf 'on: push\njobs:\n  build:\n    runs-on: x\n    steps:\n      - run: mkdir -p out && echo "built-$((6*7))" > out/app\n' > "$RUNNER_TEMP/export/w.yml"
          timeout 900 cargo run -q -p podrunner -- run "$RUNNER_TEMP/export/w.yml" \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" \
            --export "$RUNNER_TEMP/export/out" | tee "$RUNNER_TEMP/export.txt"
          grep -qx 'ok      build' "$RUNNER_TEMP/export.txt"
          find "$RUNNER_TEMP/export/out" -name app -path '*build.0*' | head -1 | xargs cat | grep -qx built-42
      # T-138: --toolcache DIR, read-only in the podvm unit and linked into
      # _work/_tool: the job finds a tool of the cache and adds a new one.
      - name: A tool cache in a podvm unit (a measure)
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        continue-on-error: true
        run: |
          set -eu
          set -o pipefail
          tc="$RUNNER_TEMP/toolcache"
          mkdir -p "$tc/cache/mytool/1.0.0/x64"
          printf '#!/bin/sh\necho tool-$((6*7))\n' > "$tc/cache/mytool/1.0.0/x64/mytool"
          chmod -R a+rX "$tc/cache" && chmod a+x "$tc/cache/mytool/1.0.0/x64/mytool"
          touch "$tc/cache/mytool/1.0.0/x64.complete"
          printf 'on: push\njobs:\n  use:\n    runs-on: x\n    steps:\n      - run: test -f "$RUNNER_TOOL_CACHE/mytool/1.0.0/x64.complete" && "$RUNNER_TOOL_CACHE/mytool/1.0.0/x64/mytool" | grep -qx tool-42\n      - run: mkdir -p "$RUNNER_TOOL_CACHE/other/2.0.0/x64"\n' > "$tc/w.yml"
          timeout 900 cargo run -q -p podrunner -- run "$tc/w.yml" \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" \
            --toolcache "$tc/cache" | tee "$RUNNER_TEMP/toolcache.txt"
          grep -qx 'ok      use' "$RUNNER_TEMP/toolcache.txt"
          test ! -e "$tc/cache/other"
          echo "toolcache ok" >> "$GITHUB_STEP_SUMMARY"
      # T-129: the larger runner image (images/runner/full.txt, the common
      # tools of ubuntu-latest) as the image of a label. A measure: its size,
      # and a job of `runs-on: ubuntu-latest` that uses its tools.
      - name: The larger runner image by label (a measure)
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          set -eu
          set -o pipefail
          sh scripts/retry.sh docker buildx build -f images/runner/Dockerfile --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg "RUNNER_VERSION=$VERSION" --build-arg "RUNNER_SHA256=$SHA256" \
            --build-arg "EXTRA_PACKAGES=$(cat images/runner/full.txt)" \
            --output "type=oci,dest=$RUNNER_TEMP/full.tar" .
          echo "the larger image: $(du -m "$RUNNER_TEMP/full.tar" | cut -f1) MiB (the archive)" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/full" && tar -xf "$RUNNER_TEMP/full.tar" -C "$RUNNER_TEMP/full"
          digest=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifests"][0]["digest"])' "$RUNNER_TEMP/full/index.json")
          # As the base image: the ref name in the index, and the files of the
          # layout only.
          python3 -I - "$RUNNER_TEMP/full" "runner:full" <<'PY'
          import json, sys
          p = sys.argv[1] + "/index.json"
          d = json.load(open(p))
          d["manifests"][0].setdefault("annotations", {})["org.opencontainers.image.ref.name"] = sys.argv[2]
          json.dump(d, open(p, "w"))
          PY
          (cd "$RUNNER_TEMP/full" && find . -type f | sed 's#^\./##' | sort | tar -cf ../full-load.tar --no-recursion -T -)
          PODVM_STORE="$PODRUNNER_PODVM_IMAGES" "$PODRUNNER_PODVM" load -i "$RUNNER_TEMP/full-load.tar"
          printf 'on: push\njobs:\n  tools:\n    runs-on: ubuntu-latest\n    steps:\n      - run: python3 --version && node --version && make --version | head -1 && cmake --version | head -1 && zip -v | head -2\n' > "$RUNNER_TEMP/full/w.yml"
          timeout 900 cargo run -q -p podrunner -- run "$RUNNER_TEMP/full/w.yml" \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --platform "ubuntu-latest=runner@$digest" | tee "$RUNNER_TEMP/full.txt"
          grep -qx 'ok      tools' "$RUNNER_TEMP/full.txt"
      # T-037 step 1: the machine tier of podvm for the microvm kind. A
      # measure (KVM and QEMU come from the setup step).
      - name: The runner image as a guest of the machine tier (a measure)
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        run: |
          set -eu
          sh scripts/measure-machine.sh "$PODRUNNER_PODVM" "$PODRUNNER_PODVM_IMAGES" "$PODRUNNER_RUNNER_IMAGE" \
            "$RUNNER_TEMP/machine" | tee -a "$GITHUB_STEP_SUMMARY"
      # T-151: a guest of another architecture (linux/arm64) in the machine
      # tier on this x86_64 host, emulated by QEMU. A measure for
      # docs/unknowns.md.
      - name: A guest of another architecture (a measure)
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        continue-on-error: true
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64
          sh scripts/measure-foreign.sh "$PODRUNNER_PODVM" "$RUNNER_TEMP/foreign" | tee -a "$GITHUB_STEP_SUMMARY"
      # T-037: the unit tests of the acceptance of the microvm kind on real
      # guests (KVM from the step before). A check.
      - name: The microvm kind passes its unit tests
        if: matrix.arch == 'x86_64'
        run: |
          set -eu
          PODRUNNER_PODVM_IMAGE="$PODRUNNER_RUNNER_IMAGE" timeout 3600 \
            cargo test -p podrunner-microvm --test conformance -- --ignored --nocapture
          # T-036: a guest with no NIC passes the guest self-test.
          PODRUNNER_PODVM_IMAGE="$PODRUNNER_RUNNER_IMAGE" timeout 600 \
            cargo test -p podrunner-microvm --test selftest -- --ignored --nocapture
          # T-037 step 3: the official runner in a guest takes a canned job
          # of the fake broker through the one channel of the guest.
          timeout 900 cargo test -p podrunner-broker-fake --test microvm -- --ignored --nocapture
          # T-037: the acceptance of GitHub #37, a fork pull request through
          # slots into a guest, and a container need refused.
          timeout 1200 cargo test -p podrunner-broker-fake --test untrusted -- --ignored --nocapture
          # T-123: podrunner run, each job in a fresh guest with no NIC; the
          # front of the egress socket gives the fake broker.
          timeout 2400 cargo run -q -p podrunner -- run crates/podrunner/tests/local/suite.yml \
            --microvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" --checkout . \
            | tee "$RUNNER_TEMP/local-microvm.txt"
          test "$(grep -c '^ok ' "$RUNNER_TEMP/local-microvm.txt")" = 8
          # T-123: a guest reaches no host but the broker; with --allow the
          # egress module lets the same step reach the host, and it fails.
          guest_egress() {
            timeout 900 cargo run -q -p podrunner -- run crates/podrunner/tests/local/egress.yml \
              --microvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" "$@" || true
          }
          guest_egress | tee "$RUNNER_TEMP/egress-microvm.txt"
          grep -qx 'ok      denied' "$RUNNER_TEMP/egress-microvm.txt"
          guest_egress --allow example.com | tee "$RUNNER_TEMP/egress-microvm-allow.txt"
          grep -qx 'failure denied' "$RUNNER_TEMP/egress-microvm-allow.txt"
      # T-103 step 3: a container engine inside a guest of the machine tier
      # (KVM from the machine measure). A measure: the static Docker binaries
      # and a saved image go in by a 9p volume.
      - name: A container engine in a guest (a measure)
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        continue-on-error: true
        run: |
          set -eu
          v=27.5.1
          sh scripts/retry.sh curl -fsSLo "$RUNNER_TEMP/docker.tgz" "https://download.docker.com/linux/static/stable/x86_64/docker-$v.tgz"
          echo "engine docker $v sha256 $(sha256sum "$RUNNER_TEMP/docker.tgz" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          sh scripts/retry.sh docker pull -q public.ecr.aws/docker/library/busybox:1.37
          docker tag public.ecr.aws/docker/library/busybox:1.37 measure:latest
          docker save measure:latest -o "$RUNNER_TEMP/measure.tar"
          sh scripts/measure-engine.sh "$PODRUNNER_PODVM" "$PODRUNNER_PODVM_IMAGES" "$PODRUNNER_RUNNER_IMAGE" \
            "$RUNNER_TEMP/engine" "$RUNNER_TEMP/docker.tgz" "$RUNNER_TEMP/measure.tar" | tee -a "$GITHUB_STEP_SUMMARY"
          # T-103: the microvm kind with an engine, through its driver.
          mkdir -p "$RUNNER_TEMP/engine-dir"
          tar -xzf "$RUNNER_TEMP/docker.tgz" -C "$RUNNER_TEMP/engine-dir" --strip-components=1
          cp "$RUNNER_TEMP/measure.tar" "$RUNNER_TEMP/engine-dir/image.tar"
          chmod -R a+rX "$RUNNER_TEMP/engine-dir"
          cargo test -p podrunner-microvm --test engine --no-run
          PODRUNNER_PODVM_IMAGE="$PODRUNNER_RUNNER_IMAGE" PODRUNNER_ENGINE_DIR="$RUNNER_TEMP/engine-dir" timeout 900 \
            cargo test -p podrunner-microvm --test engine -- --ignored --nocapture
      # T-103, T-124: a check, not a measure: the parity suite in guests with
      # an engine (the engine directory of the step before).
      - name: The parity suite in guests with an engine
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        run: |
          set -eu
          # T-103, T-124: the parity suite in guests with an engine: services:,
          # a job container, a Dockerfile action. dockerd pulls through the
          # egress module, which allows the hosts of the registry only.
          # Docker Hub sends each blob to a CDN by a 307: Cloudflare, its R2
          # bucket of the layers, or CloudFront. The run fails on a denied host.
          hub="--allow registry-1.docker.io --allow auth.docker.io --allow production.cloudflare.docker.com"
          hub="$hub --allow docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com"
          hub="$hub --allow production.cloudfront.docker.com"
          # From the hosted runners of GitHub, the layers come from S3.
          hub="$hub --allow docker-images-prod.s3.dualstack.us-east-1.amazonaws.com"
          # A step with no shell: has no pipefail: tee would hide the exit of the test.
          set -o pipefail
          PODRUNNER_PARITY_UNIT="--microvm $PODRUNNER_PODVM --images $PODRUNNER_PODVM_IMAGES --image $PODRUNNER_RUNNER_IMAGE --engine $RUNNER_TEMP/engine-dir $hub" \
            timeout 5400 cargo test -p podrunner --test parity -- --ignored --nocapture | tee "$RUNNER_TEMP/parity-engine.txt"
          grep '^parity ' "$RUNNER_TEMP/parity-engine.txt" >> "$GITHUB_STEP_SUMMARY"
      # T-157: the engine of a guest takes the images from the store of the
      # run through the broker, its mirror of Docker Hub. No --allow: the
      # guest reaches no registry, so each pull comes from the mirror.
      - name: The images of a guest engine from the store
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        run: |
          set -eu
          cargo build -q -p podrunner
          for w in 04-services 05-containers; do
            timeout 1800 target/x86_64-unknown-linux-musl/debug/podrunner run "crates/podrunner/tests/local/parity/$w.yml" \
              --microvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" \
              --engine "$RUNNER_TEMP/engine-dir" --checkout . --frozen
            echo "mirror $w ok" >> "$GITHUB_STEP_SUMMARY"
          done
      # T-105 step 1: the incus tier of podvm for the incus kind. A measure:
      # incus from apt, initialized with its defaults, and podvm in the
      # group of its socket.
      - name: The runner image as a system container of incus (a measure)
        # It runs after a failed step too: the incus kind does not depend on
        # the microvm kind.
        if: ${{ !cancelled() && matrix.arch == 'x86_64' }}
        continue-on-error: true
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get -qq update
          # incus admin init makes a bridge network, which needs dnsmasq.
          sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends incus dnsmasq-base
          sudo incus admin init --minimal
          sudo usermod -aG incus-admin "$USER"
          sg incus-admin -c "sh scripts/measure-incus.sh '$PODRUNNER_PODVM' '$PODRUNNER_PODVM_IMAGES' '$PODRUNNER_RUNNER_IMAGE' '$RUNNER_TEMP/incus'" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # T-105 step 2: the unit tests of the incus kind on real instances.
          cargo test -p podrunner-incus --test conformance --no-run
          sg incus-admin -c "PODRUNNER_PODVM_IMAGE='$PODRUNNER_RUNNER_IMAGE' timeout 1800 cargo test -p podrunner-incus --test conformance -- --ignored --nocapture"
          # T-109: no NIC, and the egress socket as the one way out.
          cargo test -p podrunner-incus --test egress --no-run
          sg incus-admin -c "PODRUNNER_PODVM_IMAGE='$PODRUNNER_RUNNER_IMAGE' timeout 600 cargo test -p podrunner-incus --test egress -- --ignored --nocapture"
          # T-123: podrunner run, each job in a fresh incus instance.
          cargo build -q -p podrunner
          sg incus-admin -c "timeout 2400 target/x86_64-unknown-linux-musl/debug/podrunner run crates/podrunner/tests/local/suite.yml --incus '$PODRUNNER_PODVM' --images '$PODRUNNER_PODVM_IMAGES' --image '$PODRUNNER_RUNNER_IMAGE' --checkout ." \
            | tee "$RUNNER_TEMP/local-incus.txt"
          test "$(grep -c '^ok ' "$RUNNER_TEMP/local-incus.txt")" = 8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-${{ matrix.arch }}
          path: |
            runner-${{ matrix.arch }}.tar
            runner-${{ matrix.arch }}.tar.sha256
          retention-days: 30
