name: runner-image

# The unit image of the official runner (GitHub #30): the version and the
# digest of each tarball come from images/runner/runner.toml (a reviewed
# file). Each architecture builds on its own GitHub-hosted runner, to an
# OCI archive with the digest of its manifest; a host imports the archive
# and pins that digest (docs/configuration.md, [pin]).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/podvm.toml
      - images/podnet.toml
      - scripts/measure-podnet-pod.sh
      - scripts/measure-container-verbs.sh
      - scripts/measure-machine.sh
      - crates/podrunner-fake/**
      - images/runner/**
      - scripts/runner-audit.sh
      - crates/podrunner-hook/relay/**
      - crates/podrunner-podvm/**
      - crates/podrunner-microvm/**
      - crates/podrunner-unit/**
      - crates/podrunner-broker-fake/**
      - crates/podrunner-local/**
      - crates/podrunner/src/run_local.rs
      - crates/podrunner/src/run_local/**
      - crates/podrunner/tests/local/**
      - .github/workflows/runner-image.yml

permissions:
  contents: read

jobs:
  # T-082: the NuGet advisories of the pinned runner against the reviewed
  # list images/runner/advisories.txt.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone the runner tag
        run: |
          set -eu
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("images/runner/runner.toml", "rb"))["version"])')
          sh scripts/retry.sh git clone -q --depth 1 --branch "v$version" https://github.com/actions/runner.git "$RUNNER_TEMP/runner-src"
          echo "RUNNER_SRC=$RUNNER_TEMP/runner-src" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ env.RUNNER_SRC }}/src/global.json
      - name: The advisories of the runner are the reviewed ones
        run: sh scripts/runner-audit.sh "$RUNNER_SRC" images/runner/advisories.txt | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runs-on: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version and the digest of the tarball
        id: pin
        run: |
          set -eu
          python3 -I - "${{ matrix.arch }}" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, tomllib
          pin = tomllib.load(open("images/runner/runner.toml", "rb"))
          print("version=" + pin["version"])
          print("sha256=" + pin["sha256"][sys.argv[1]])
          PY
      - name: Build the OCI archive
        id: build
        env:
          VERSION: ${{ steps.pin.outputs.version }}
          SHA256: ${{ steps.pin.outputs.sha256 }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # The host network for the build: the resolver of the build
          # container failed for the Ubuntu mirrors.
          docker buildx create --use --name podrunner --driver-opt network=host > /dev/null
          # No attestation: the archive holds one image manifest, which
          # podvm load takes.
          sh scripts/retry.sh docker buildx build -f images/runner/Dockerfile --platform "$PLATFORM" --provenance=false --sbom=false \
            --build-arg "RUNNER_VERSION=$VERSION" --build-arg "RUNNER_SHA256=$SHA256" \
            --output "type=oci,dest=runner-$ARCH.tar" .
          sha256sum "runner-$ARCH.tar" | tee "runner-$ARCH.tar.sha256"
          mkdir oci && tar -xf "runner-$ARCH.tar" -C oci
          digest=$(python3 -I -c 'import json; print(json.load(open("oci/index.json"))["manifests"][0]["digest"])')
          echo "the image: runner@$digest (runner $VERSION, $ARCH)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The import of the archive into a podvm store as a user with no root
      # (the user of the runner), and a start of the runner in it.
      - name: Import into a podvm store
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -eu
          eval "$(python3 -I - "$ARCH" <<'PY'
          import sys, tomllib
          pin = tomllib.load(open("images/podvm.toml", "rb"))
          print(f"podvm_version={pin['version']} podvm_sha256={pin['sha256'][sys.argv[1]]}")
          PY
          )"
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/podvm" \
            "https://github.com/PodUtils/podvm/releases/download/v$podvm_version/podvm-$ARCH"
          echo "$podvm_sha256  $RUNNER_TEMP/podvm" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/podvm"
          test "$(id -u)" -ne 0
          export PODVM_STORE="$RUNNER_TEMP/store"
          # podvm registers the image under the ref name of the index.
          python3 -I - oci "runner:$VERSION" <<'PY'
          import json, sys
          p = sys.argv[1] + "/index.json"
          d = json.load(open(p))
          d["manifests"][0].setdefault("annotations", {})["org.opencontainers.image.ref.name"] = sys.argv[2]
          json.dump(d, open(p, "w"))
          PY
          # podvm takes the files of the layout only, with no directory entry.
          (cd oci && find . -type f | sed 's#^\./##' | sort | tar -cf ../load.tar --no-recursion -T -)
          "$RUNNER_TEMP/podvm" probe 2>&1 | sed -n 2p
          "$RUNNER_TEMP/podvm" load -i load.tar
          "$RUNNER_TEMP/podvm" images
          image="runner@${{ steps.build.outputs.digest }}"
          check='test -x /home/runner/run.sh && test -x /home/runner/hooks/podrunner-hook.sh && echo the runner files are in the image'
          # T-051: on aarch64 too, with the aarch64 interposer of podvm.
          "$RUNNER_TEMP/podvm" run --rm "$image" /bin/sh -c "$check"
          echo "PODRUNNER_PODVM=$RUNNER_TEMP/podvm" >> "$GITHUB_ENV"
          echo "PODRUNNER_PODVM_IMAGES=$PODVM_STORE" >> "$GITHUB_ENV"
          echo "PODRUNNER_RUNNER_IMAGE=$image" >> "$GITHUB_ENV"
          # The payload image of the unit conformance suite: it has sh,
          # setsid, env and sleep.
          echo "PODRUNNER_PODVM_IMAGE=$image" >> "$GITHUB_ENV"
          # The podnet of the egress hold (T-065), pinned in images/podnet.toml.
          eval "$(python3 -I - "$ARCH" <<'PY'
          import sys, tomllib
          pin = tomllib.load(open("images/podnet.toml", "rb"))
          print(f"podnet_version={pin['version']} podnet_sha256={pin['sha256'][sys.argv[1]]}")
          PY
          )"
          sh scripts/retry.sh curl -qfsSLo "$RUNNER_TEMP/podnet" \
            "https://github.com/PodUtils/podnet/releases/download/v$podnet_version/podnet-$ARCH-unknown-linux-musl"
          echo "$podnet_sha256  $RUNNER_TEMP/podnet" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/podnet"
          echo "PODRUNNER_PODNET=$RUNNER_TEMP/podnet" >> "$GITHUB_ENV"
          # The job container of the hook test: the same image (it has tail).
          echo "PODRUNNER_JOB_IMAGE=$image" >> "$GITHUB_ENV"
      # T-026: the podvm driver runs the image with the JIT files of the
      # fake broker; the runner takes one canned job and completes it.
      # T-035: a container job through the hooks of the podvm unit.
      # T-053, T-063: the unit conformance suite on the podvm driver.
      - name: The runner in a podvm unit runs a canned job and a container job
        if: matrix.arch == 'x86_64'
        run: |
          set -eu
          sh scripts/retry.sh rustup toolchain install
          cargo test -p podrunner-broker-fake --test podvm -- --ignored --nocapture
          # T-090: podrunner run runs the suite of the local mode, each job
          # in a fresh podvm unit of the runner image. T-095: each unit is
          # held; it reaches only the fake broker on the loopback.
          timeout 1200 cargo run -q -p podrunner -- run crates/podrunner/tests/local/suite.yml \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" --checkout . \
            --podnet "$PODRUNNER_PODNET" | tee "$RUNNER_TEMP/local.txt"
          test "$(grep -c '^ok ' "$RUNNER_TEMP/local.txt")" = 8
          # T-093: a container: job and a Docker step through the hooks.
          sed "s|IMAGE|$PODRUNNER_RUNNER_IMAGE|" crates/podrunner/tests/local/containers.yml > "$RUNNER_TEMP/containers.yml"
          timeout 1200 cargo run -q -p podrunner -- run "$RUNNER_TEMP/containers.yml" \
            --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" | tee "$RUNNER_TEMP/containers.txt"
          test "$(grep -c '^ok ' "$RUNNER_TEMP/containers.txt")" = 2
          # T-095: the egress of a held unit: no host but the ones of --allow.
          # The plant: with no hold the same step reaches the host and fails.
          run_egress() {
            timeout 600 cargo run -q -p podrunner -- run crates/podrunner/tests/local/egress.yml \
              --podvm "$PODRUNNER_PODVM" --images "$PODRUNNER_PODVM_IMAGES" --image "$PODRUNNER_RUNNER_IMAGE" "$@" || true
          }
          run_egress --podnet "$PODRUNNER_PODNET" | tee "$RUNNER_TEMP/egress.txt"
          grep -qx 'ok      denied' "$RUNNER_TEMP/egress.txt"
          run_egress | tee "$RUNNER_TEMP/egress-plant.txt"
          grep -q '^failure denied' "$RUNNER_TEMP/egress-plant.txt"
          # T-096: tar in a unit of the runner image; each form prints one
          # line and must pass. The host gets an empty directory at each
          # absolute path of -C: a unit must not write into it. A second
          # pass has no such host directory (the failure of podvm beta.6).
          tar_forms() {
          PODVM_STORE="$PODRUNNER_PODVM_IMAGES" "$PODRUNNER_PODVM" run --rm "$PODRUNNER_RUNNER_IMAGE" /bin/bash -c '
            # /tmp, and the workspace path of the failed step (T-096).
            for b in /tmp /home/runner/_work/app; do
              mkdir -p "$b" && cd "$b" && echo x > f && tar -cf x.tar f && gzip -c x.tar > x.tgz
              m() { rm -rf d && mkdir -p d && if ( eval "$2" ) > /dev/null 2>&1 && test -f d/f; then echo "tar $b $1 ok"; else echo "tar $b $1 failed"; fi; }
              m -C "tar -xf x.tar -C d"
              m -C-z "tar -xzf x.tgz -C d"
              m -C-abs "tar -xzf x.tgz -C $b/d"
              m -C-abs-plain "tar -xf x.tar -C $b/d"
              m cd "cd d && tar -xf ../x.tar"
              m cd-gzip "cd d && gzip -dc ../x.tgz | tar -xf -"
              m cd-z "cd d && tar -xzf ../x.tgz"
            done' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/tar.txt"
          }
          for h in /tmp/d /home/runner/_work/app/d; do rm -rf "$h"; mkdir -p "$h"; done
          tar_forms
          for h in /tmp/d /home/runner/_work/app/d; do
            if [ -z "$(ls -A "$h")" ]; then echo "tar host $h untouched"; else echo "tar host $h written: $(ls -A "$h" | tr '\n' ' ')"; fi
          done | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/tar.txt"
          rm -rf /tmp/d /home/runner/_work/app/d
          tar_forms
          if grep -E 'failed|written' "$RUNNER_TEMP/tar.txt"; then exit 1; fi
          test "$(grep -c ' ok$' "$RUNNER_TEMP/tar.txt")" = 28
          cargo test -p podrunner-podvm --test conformance --no-run
          timeout 600 cargo test -p podrunner-podvm --test conformance -- --ignored --nocapture
          # T-065: the egress hold of a unit under podnet pod.
          sh scripts/measure-podnet-pod.sh "$PODRUNNER_PODNET" "$PODRUNNER_PODVM" "$RUNNER_TEMP/podnet-measure"
          timeout 300 cargo test -p podrunner-podvm --test hold -- --ignored --nocapture
          # T-065 step 4: a held runner reaches an allowed host and not a denied one.
          timeout 600 cargo test -p podrunner-broker-fake --test held -- --ignored --nocapture
          # T-061: an absolute link resolves in the rootfs of the unit.
          timeout 300 cargo test -p podrunner-podvm --test links -- --ignored --nocapture
          # T-079: the same under the confine layer of podvm, proven first.
          PODRUNNER_PODVM_CONFINE=1 timeout 600 cargo test -p podrunner-podvm --test conformance -- --ignored --nocapture
          PODRUNNER_PODVM_CONFINE=1 cargo test -p podrunner-broker-fake --test podvm -- --ignored --nocapture
          sh scripts/measure-podvm-confine.sh "$PODRUNNER_PODVM" "$RUNNER_TEMP/confine"
          # T-078: the labels and the run report of podvm.
          timeout 300 cargo test -p podrunner-podvm --test report -- --ignored --nocapture
          # T-062: a step through exec cannot write the externals (:ro).
          sh scripts/measure-container-verbs.sh "$PODRUNNER_PODVM" "$RUNNER_TEMP/verbs" | tee "$RUNNER_TEMP/verbs.txt"
          grep -qx 'externals-read-only ok' "$RUNNER_TEMP/verbs.txt"
      # T-037 step 1: the machine tier of podvm for the microvm kind. A
      # measure: KVM through the udev rule of podvm's kvm.yml, and QEMU.
      - name: The runner image as a guest of the machine tier (a measure)
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        run: |
          set -eu
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          sh scripts/retry.sh sudo apt-get -qq update
          sh scripts/retry.sh sudo apt-get -qq install -y --no-install-recommends qemu-system-x86
          sh scripts/measure-machine.sh "$PODRUNNER_PODVM" "$PODRUNNER_PODVM_IMAGES" "$PODRUNNER_RUNNER_IMAGE" \
            "$RUNNER_TEMP/machine" | tee -a "$GITHUB_STEP_SUMMARY"
          # T-037 step 2: the unit tests of the acceptance on the microvm kind.
          PODRUNNER_PODVM_IMAGE="$PODRUNNER_RUNNER_IMAGE" timeout 3600 \
            cargo test -p podrunner-microvm --test conformance -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-${{ matrix.arch }}
          path: |
            runner-${{ matrix.arch }}.tar
            runner-${{ matrix.arch }}.tar.sha256
          retention-days: 30
