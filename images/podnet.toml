# The podnet release that holds the egress of a podvm unit (`podnet pod`,
# T-065). runner-image.yml downloads it and checks the SHA-256 of the
# binary of its architecture.
# v0.4.0-beta.7 and later dial ::ffff:127.0.0.1 direct in the seccomp hold
# (T-077).
# v0.4.0-beta.10 and later take `--loopback-rules`: the seccomp hold of the
# local mode lets only the broker of the run through on the loopback (T-319,
# PodUtils/podnet#605).
# v0.4.0-beta.14 and later take `PODNET_VNET_FORWARD`: a TCP address of the
# vnet that connects to a unix socket (#170, T-350).
# v0.4.0-beta.17 and later keep the nonblocking socket of an epoll waiter on
# the relay of the seccomp hold (#142, T-179).
version = "0.4.0-beta.17"

