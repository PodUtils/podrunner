# The podvm release that the image pipeline imports the runner image with
# (T-030), and the SHA-256 of each binary, from its release (`.sha256`).
# `[ghcr] reference` is the index of the same release on ghcr.io, from the
# notes of the release (T-553, COORD-142); a new version needs a new one
# (scripts/install-pins.py refuses a reference of another tag). The lowest
# podvm of each kind is in crates/podrunner-podvm/src/probe.rs.
#
# The lowest version for each feature that podrunner uses:
# - 0.2.0-beta.5: a tree for each container, absolute links in the rootfs,
#   `:ro` on `exec`, labels and the run report.
# - beta.9: the owners of the image in a guest of the machine tier,
#   `--podvm-net none` and `--podvm-channel`.
# - beta.13: no NIC and one channel on the incus tier (a socket file and a
#   relay).
# - beta.14: `--podvm-engine` (a container engine in a guest).
# - beta.20: the limits of an incus instance (`--memory`, `--cpus`,
#   `--pids-limit`).
# - beta.22: `--hostname` of `run` and name resolution under
#   `--podvm-confine`; an attestation of each binary.
# - beta.30: a PID namespace and a `/proc` for `run -d` on the namespace
#   rung.
# - beta.32: `--podvm-volume-base`, `exec --env-file` and the cgroup leaf of
#   `run -d`.
# - beta.33: `--env-file0`; on the incus tier `--storage-opt size=N` and
#   the CPU time, the peak memory and the OOM kills in `inspect`.
# - beta.36: `--podvm-init=image` (the init of the image as PID 1 on the
#   incus tier).
# - beta.37: `State` of `inspect` as the object of docker, and `logs` with
#   `--limit-bytes`.
# - beta.38: a layer of GNU tar `--acls` extracts, `inspect` gives the types
#   of docker, and `run -d --rm` removes the container at its end.
# - beta.39: `inspect` of a stopped incus instance gives the CPU time, the
#   peak memory and the OOM kills; an image that does not fit in a `dir`
#   pool is refused before the import; one import for parallel runs.
# - beta.40: that record also on a host with AppArmor and cgroup v2 (a
#   hosted runner); `--podvm-init=image` waits while systemd is `offline`
#   (`PODVM_INIT_BOOT_TIMEOUT`); an import keeps one tree and sends gzip
#   where the images of incusd lack room.
version = "0.2.0-beta.40"

[sha256]
x86_64 = "05be17194d0a6ee757f57e7a5cf5e897f73b303efba4c19b68b97b65e47ce422"
aarch64 = "dcfc914ecbb7fcb8cb8b983a438130f691234f5a68d1db6e08cc15398670aaa3"

[ghcr]
reference = "ghcr.io/podutils/podvm:v0.2.0-beta.40@sha256:31f5f9494bda68c4ab8f2aeb8a2295c7c5da6f944f3416ce29ebac304ba0c9a1"
