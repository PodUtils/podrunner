# The podvm release that the image pipeline imports the runner image with
# (T-030), and the SHA-256 of each binary, from its release (`.sha256`).
# The podvm driver needs v0.2.0-beta.5 or later: a tree for each container
# (T-064), absolute links in the rootfs (T-061), `:ro` on `exec` (T-062),
# labels and the run report (T-078).
# v0.2.0-beta.6 carries the aarch64 interposer objects (T-051); beta.7 the
# fortified opens of glibc in the interposer (T-096); beta.8 the fixes of
# podvm's QA pass; beta.9 the owners of the image in a guest of the
# machine tier, `--podvm-net none` and `--podvm-channel` (T-037); beta.10
# the channel on `pod-link` with its socket in a directory of mode 0700,
# and stdin for an incus instance that stays (`run -d -i`, T-105); beta.11
# keeps the proxy variables of a guest with no NIC (PodUtils/podvm#311);
# beta.12 no NIC and one channel on the incus tier; beta.13 that channel
# as a socket file and a relay, with no proxy device (T-109); beta.14
# --podvm-engine for a container engine in a guest (T-103).
version = "0.2.0-beta.14"

