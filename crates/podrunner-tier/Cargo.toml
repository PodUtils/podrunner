[package]
name = "podrunner-tier"
description = "The tier rule of podrunner: trust from job metadata, never from a label"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
podrunner-schema.workspace = true
serde.workspace = true
# The published case table (`cases`) and the names of the events.
serde_json.workspace = true
# The JsonSchema of the trust lists, for the schema of `podrunner.toml` in
# the tests of podrunner-slots only: the binaries carry no schemars.
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars", "podrunner-schema/schema"]

