[package]
name = "podrunner-egress"
description = "The egress module of podrunner: pod-broker with one listener for each unit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pod-broker.workspace = true
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0", features = ["async"] }
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0" }
# The resolver: the system, the cache, DNS over HTTPS by address (T-076).
pod-dns = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0" }
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.38.0" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio.workspace = true
