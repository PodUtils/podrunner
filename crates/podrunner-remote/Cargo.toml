[package]
name = "podrunner-remote"
description = "The remote mint of podrunner: the source wire over mutual TLS, an offer ledger, one credential for each job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
podrunner-schema.workspace = true
podrunner-source.workspace = true
podrunner-tier.workspace = true
# The HTTP reader of the control socket: one request on each connection.
podrunner-hook.workspace = true
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.27.0", default-features = false }
# The provider of the TLS of the remote mint: ring, as `sign` uses.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
podrunner-clock.workspace = true
podrunner-fake.workspace = true
