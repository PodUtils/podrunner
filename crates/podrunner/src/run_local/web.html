<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podrunner run</title>
<style>
:root { --bg: #fafafa; --fg: #1b1b1b; --muted: #666; --line: #ddd; --ok: #1a7f37; --bad: #cf222e; --run: #9a6700; --code: #f0f0f0; }
@media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #e6e6e6; --muted: #999; --line: #333; --ok: #3fb950; --bad: #f85149; --run: #d29922; --code: #1c1c1c; } }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
h1 { font-size: 18px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 16px; }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
li.sel { outline: 2px solid var(--muted); }
.state { font-size: 12px; color: var(--muted); display: block; overflow-wrap: anywhere; }
.success { color: var(--ok); } .failure, .cancelled { color: var(--bad); } .running { color: var(--run); }
pre { margin: 0; padding: 8px; background: var(--code); border-radius: 6px; overflow: auto; max-height: 75vh; white-space: pre-wrap; overflow-wrap: anywhere; }
a { color: inherit; }
#status { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>podrunner run</h1>
<div id="status">Loading.</div>
<div class="grid">
  <div>
    <ul id="jobs"></ul>
    <h2 style="font-size:14px">Artifacts</h2>
    <ul id="artifacts"></ul>
  </div>
  <pre id="log"></pre>
</div>
<script>
// The page reads state.json beside it: one request each second, no other host.
let selected = null;
function kind(state) { return state.split(':')[0]; }
function el(tag, text, cls) { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; }
async function tick() {
  let s;
  try { s = await (await fetch('state.json', { cache: 'no-store' })).json(); }
  catch (e) { document.getElementById('status').textContent = 'The run is not reachable.'; return; }
  document.getElementById('status').textContent = s.done ? 'The run ended.' : 'The run is in progress.';
  const jobs = document.getElementById('jobs');
  jobs.replaceChildren(...s.jobs.map(j => {
    const li = el('li', j.name);
    li.append(el('span', j.state, 'state ' + kind(j.state)));
    if (j.id === selected) li.className = 'sel';
    li.onclick = () => { selected = j.id; tick(); };
    return li;
  }));
  if (selected === null && s.jobs.length) selected = s.jobs[s.jobs.length - 1].id;
  const job = s.jobs.find(j => j.id === selected);
  const log = document.getElementById('log');
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = job ? job.log : '';
  if (atEnd) log.scrollTop = log.scrollHeight;
  const arts = document.getElementById('artifacts');
  arts.replaceChildren(...s.artifacts.map(n => {
    const li = el('li', '');
    const a = el('a', n + '.zip');
    a.href = 'artifacts/' + encodeURIComponent(n);
    li.append(a);
    return li;
  }));
  if (!s.done) setTimeout(tick, 1000);
}
tick();
</script>
</body>
</html>
