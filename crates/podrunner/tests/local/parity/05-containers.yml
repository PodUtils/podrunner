# A job container and a Docker step by digest (T-147, T-124). It needs a
# unit with a container route: the engine of --microvm --engine, or the
# hooks of --podvm.
name: parity containers
on: push
jobs:
  inside:
    runs-on: local
    container: busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    steps:
      - run: test "$(cat /etc/hostname)" = "$(hostname)" && echo "in-container-$((6*7))"
        shell: sh
      - uses: docker://busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
        with:
          entrypoint: /bin/true
