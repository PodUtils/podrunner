# An artifact round trip with a check of its content (T-147, T-119). With
# `--var PLANT=1` the downloaded file changes and the check fails: a plant
# of the test.
name: parity artifacts
on: push
defaults:
  run:
    shell: bash
jobs:
  up:
    runs-on: local
    outputs:
      sum: ${{ steps.f.outputs.sum }}
    steps:
      - id: f
        run: |
          mkdir out && seq 1 1000 > out/data
          echo "sum=$(sha256sum out/data | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: out/data
  down:
    needs: up
    runs-on: local
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: data
      - if: vars.PLANT == '1'
        run: echo planted >> data
      - run: test "$(sha256sum data | cut -d' ' -f1)" = "${{ needs.up.outputs.sum }}"
