# A marketplace action by tag and a local composite action with outputs
# (T-147, T-118). The token is made up: the script calls no API, and the
# token of the job is T-122.
name: parity actions
on: push
defaults:
  run:
    shell: bash
jobs:
  local:
    runs-on: local
    steps:
      - uses: actions/checkout@v4
      - id: sq
        uses: ./crates/podrunner/tests/local/parity/composite
        with:
          n: 7
      - run: test "${{ steps.sq.outputs.square }}" = 49
  market:
    runs-on: local
    steps:
      - id: script
        uses: actions/github-script@v7
        with:
          github-token: made-up-for-a-script-with-no-api-call
          result-encoding: string
          script: return String(6 * 7)
      - run: test "${{ steps.script.outputs.result }}" = 42
