# The containers of the local mode (T-093), for `podrunner run --podvm`:
# a job in a `container:` and a Docker step, through the container hooks
# of the podvm unit. IMAGE is a NAME@sha256:HEX of the store: CI writes the
# digest of the runner image here before the run.
name: podrunner local containers
on: push
jobs:
  in-container:
    runs-on: local
    container:
      image: IMAGE
    steps:
      - run: echo "podrunner-container-$((6*7))" > marker.txt && test "$(cat marker.txt)" = podrunner-container-42

  # A Docker step in a job with no `container:`: the runner sends no
  # `prepare_job`, and the step runs as on GitHub (Q4, T-098).
  docker-step:
    runs-on: local
    steps:
      # The runner splits `args` at each space on the hooks path
      # (ContainerHookManager of runner v2.338.2): one word for each
      # argument. `test 9 -eq 9` passes; `9 -eq 8` would fail the step.
      - uses: docker://IMAGE
        with:
          entrypoint: /usr/bin/test
          args: 9 -eq 9
