[package]
name = "podrunner"
description = "A static launcher that runs CI jobs in one fresh unit for each job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "podrunner"
path = "src/main.rs"

[dependencies]
libc.workspace = true
pod-core.workspace = true
podrunner-clock.workspace = true
podrunner-egress.workspace = true
podrunner-hook.workspace = true
podrunner-remote.workspace = true
podrunner-tier.workspace = true
toml.workspace = true
ring.workspace = true
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
# The pins of `[dns]` (T-076).
pod-dns = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
# The probes of the host that `doctor` shows (T-070).
pod-hostprobe = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0", default-features = false }
podrunner-fake.workspace = true
podrunner-mint.workspace = true
podrunner-podvm.workspace = true
podrunner-schema.workspace = true
podrunner-slots.workspace = true
podrunner-source.workspace = true
podrunner-unit.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The runner pin of the image agrees with the one of pod-services (a test).
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.28.0" }
serde_json.workspace = true
