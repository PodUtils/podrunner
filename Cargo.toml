[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The stable Rust of the day (docs/decisions.md, Toolchain). Raise it with
# rust-toolchain.toml when a new stable comes out.
rust-version = "1.99"
license = "0BSD"
repository = "https://github.com/PodUtils/podrunner"
homepage = "https://github.com/PodUtils/podrunner"
publish = false

# The crates of podcrates come by a git tag, never by a branch
# (docs/decisions.md, Delivery). A member crate names one only when it
# needs it. One tag for each crate of podcrates.
[workspace.dependencies]
# No default feature: the failure classes and their exit codes, with no tokio.
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0", default-features = false }
pod-todo = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }
# The egress broker of a job (podrunner-egress), with the async face of
# pod-core that it needs.
pod-broker = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }
# The records of a job: the offer, the capability, the reports (T-017).
pod-job = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }
# The Ed25519 key that signs the pin list (DR-4).
pod-identity = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }
# Landlock, a seccomp deny filter and no_new_privs for a `confined` unit
# (T-042).
pod-confine = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }
# The workflow model, the expansion of jobs and the expressions of GitHub
# Actions for the local mode (T-046, PodUtils/podcrates@T-251).
pod-actions-expr = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }
pod-actions-workflow = { git = "https://github.com/PodUtils/podcrates", tag = "v0.31.0" }
podrunner-local = { path = "crates/podrunner-local" }
# The RSA key of a runner against the fake broker: key generation only
# (deny.toml, RUSTSEC-2023-0071).
rsa = { version = "0.9.10", default-features = false, features = ["std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
podrunner-clock = { path = "crates/podrunner-clock" }
podrunner-egress = { path = "crates/podrunner-egress" }
podrunner-hook = { path = "crates/podrunner-hook" }
podrunner-remote = { path = "crates/podrunner-remote" }
podrunner-broker-fake = { path = "crates/podrunner-broker-fake" }
podrunner-fake = { path = "crates/podrunner-fake" }
podrunner-mint = { path = "crates/podrunner-mint" }
podrunner-podvm = { path = "crates/podrunner-podvm" }
podrunner-schema = { path = "crates/podrunner-schema" }
podrunner-slots = { path = "crates/podrunner-slots" }
podrunner-source = { path = "crates/podrunner-source" }
podrunner-tier = { path = "crates/podrunner-tier" }
podrunner-unit = { path = "crates/podrunner-unit" }
base64 = "0.23"
libc = "0.2"
# The RS256 signer of the GitHub App JWT (podrunner-mint): not the
# private-key path of rsa 0.9 (RUSTSEC-2023-0071).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The runtime of the egress broker.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
# podrunner.toml: a table and its values, with no writer.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The RSA key of a test runner: the bignum code is slow with no
# optimisation (seconds for each key).
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
