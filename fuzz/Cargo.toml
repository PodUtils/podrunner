# The fuzz targets of the parsers of podrunner (cargo-fuzz, libFuzzer).
# A workspace of its own, so that the crates of podrunner do not build the
# C++ of libFuzzer. A run needs a nightly Rust and glibc:
#
#   cd fuzz && cargo +nightly fuzz run source_wire
#
# A check needs stable Rust and a C++ compiler:
#
#   cd fuzz && cargo check --bins && cargo test --lib

[package]
name = "podrunner-fuzz"
description = "The fuzz targets of the parsers of podrunner"
version = "0.0.0"
edition = "2024"
license = "0BSD"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
podrunner = { path = "../crates/podrunner" }
podrunner-hook = { path = "../crates/podrunner-hook" }
podrunner-schema = { path = "../crates/podrunner-schema" }
podrunner-slots = { path = "../crates/podrunner-slots" }
podrunner-source = { path = "../crates/podrunner-source" }
serde_json = "1"

[[bin]]
name = "source_wire"
path = "fuzz_targets/source_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slots_config"
path = "fuzz_targets/slots_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slots_journal"
path = "fuzz_targets/slots_journal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_line"
path = "fuzz_targets/control_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hook_input"
path = "fuzz_targets/hook_input.rs"
test = false
doc = false
bench = false
