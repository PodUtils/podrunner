# `cargo todo check` reads the record in TODO/; `cargo todo set T-NNN
# STATUS` moves a status and derives the counts; `cargo todo next` gives
# the next free id; `cargo todo remap FILE` moves the citations of an
# edited file (TODO/RULES.md).
[alias]
todo = "run -q -p podrunner-todo --"

# Each binary is static (docs/decisions.md, Static, C, Rust). The default
# target is static musl: `cargo build --release` gives
# target/x86_64-unknown-linux-musl/release/podrunner. Other targets build
# with `cargo zigbuild` (zig cc as the C compiler and linker).
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
