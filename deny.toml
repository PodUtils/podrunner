# cargo-deny: the advisories, licenses, duplicate versions and sources of
# the dependencies. CI runs it (.github/workflows/gate.yml). By hand:
#
#   cargo deny --all-features --locked check advisories licenses bans sources

[graph]
all-features = true
# The release targets of podrunner (PodUtils/podrunner#11): x86_64 musl
# serves each tier of v1; aarch64 musl builds.
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory has its reason and the date it was read.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# LGPL and GPL are not allowed: the binaries are static.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of the workspace are paths.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The crates of podcrates come by a git tag (docs/decisions.md, Delivery).
allow-git = ["https://github.com/PodUtils/podcrates"]
