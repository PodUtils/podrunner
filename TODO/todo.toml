# The facts of this repository for the checker of the record
# (pod-todo of podcrates, src/config.rs). TODO/RULES.md gives the rules.

tool = "podrunner-todo"

# TODO/ROADMAP.md: M0 Decisions and bootstrap, M-A Level 1 and the podvm
# unit, M-B The official runner under podvm, M-C The mint and the live
# gates, M-D One live trusted job, L2 Level 2, L3 Live acceptance, later
# The crate dependencies later than v1.
milestones = ["M0", "M-A", "M-B", "M-C", "M-D", "L2", "L3", "later"]
categories = ["defect", "feature", "measurement", "release", "chore", "research", "docs"]
roadmap = "TODO/ROADMAP.md"
questions = "Questions for the owner"

# A code span that starts with one of these is a path of this repository.
top_dirs = ["crates", "scripts", "docs", ".github", ".githooks", ".claude", "TODO", "images", "schemas", "fuzz", "tools"]
root_files = [
  "Cargo.toml", "Cargo.lock", "README.md", "AGENTS.md", "CLAUDE.md", "SECURITY.md", "THIRD_PARTY.md", "LICENSE",
  "deny.toml", "rustfmt.toml", "rust-toolchain.toml",
]

# The documents whose ids must resolve, and the readings at a time that
# keep the ids and the paths of their time.
documents = ["README.md", "AGENTS.md", "SECURITY.md", "crates/*/README.md"]
document_dirs = ["TODO", "docs"]
readings = ["docs/reports/", "docs/research/"]
